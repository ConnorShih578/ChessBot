<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess vs SF18</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding-top: 30px; font-family: sans-serif; }
        #board { width: 400px; }
    </style>
</head>
<body>
    <div id="board"></div>
    <p id="status">Drag a piece to start</p>

    <!-- Essential Scripts -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        // 1. Initialize logic
        var game = new Chess();
        var sf = new Worker('stockfish-18-lite-single.js');

        // 2. Handle engine responses
        sf.onmessage = function(e) {
            console.log(e.data);
            if (e.data.indexOf('bestmove') > -1) {
                var m = e.data.split(' ');
                var moveStr = m[1];
                game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                document.getElementById('status').innerText = "Your Turn";
            }
        };

        // 3. Setup Board
        var board = Chessboard('board', {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com{piece}.png',
            onDrop: function(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                document.getElementById('status').innerText = "Stockfish is thinking...";
                sf.postMessage('position fen ' + game.fen());
                sf.postMessage('go depth 15');
            }
        });
    </script>
</body>
</html>
