<!DOCTYPE html>
<html>
<head>
    <title>Stockfish Playable Board</title>
    <!-- 1. Load the CSS for the board -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        #myBoard { width: 450px; margin: 20px auto; }
    </style>
</head>
<body>
    <div id="myBoard"></div>
    <button id="resetBtn">New Game</button>

    <!-- 2. Load jQuery FIRST (Required for Chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <!-- 3. Load Chessboard.js SECOND -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <!-- 4. Load Chess.js THIRD (For game logic) -->
    <script src="https://cloudflare.com"></script>

    <script>
        // Initialize the engine with your exact filename
        const engine = new Worker('stockfish-18-lite-single.js');
        var game = new Chess();

        var config = {
            draggable: true,
            position: 'start',
            onDrop: function(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                // Tell Stockfish to think
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 15');
            }
        };

        // Initialize the board (must match the div ID)
        var board = Chessboard('myBoard', config);

        // Best move handler
        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                const move = e.data.split(' ')[1];
                game.move({ from: move.substring(0, 2), to: move.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
            }
        };

        $('#resetBtn').on('click', function() {
            game.reset();
            board.start();
        });
    </script>
</body>
</html>
