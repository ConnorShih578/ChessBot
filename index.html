<!DOCTYPE html>
<html>
<head>
    <title>Stockfish 18 Game</title>
    <!-- 1. Board CSS -->
    <link rel="stylesheet" href="https://unpkg.com">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        /* CRITICAL: Explicit width and height for the board container */
        #myBoard { width: 400px; height: 400px; margin-bottom: 20px; border: 2px solid #333; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="myBoard"></div>
    <button id="resetBtn">New Game</button>
    <p id="status">Ready!</p>

    <!-- 2. Scripts (In exact order) -->
    <script src="https://jquery.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            const engine = new Worker('stockfish-18-lite-single.js');

            function onDrop(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 15');
                $('#status').text('Stockfish is thinking...');
            }

            // 3. Configuration with pieceTheme to ensure pieces show up
            var config = {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                // Loads piece images from the official website instead of your local folder
                pieceTheme: 'https://chessboardjs.com{piece}.png'
            };

            board = Chessboard('myBoard', config);

            engine.onmessage = function(e) {
                if (e.data.startsWith('bestmove')) {
                    const moveStr = e.data.split(' ')[1]; // Extract the move e.g., "e2e4"
                    game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    $('#status').text('Your turn');
                }
            };

            $('#resetBtn').on('click', function() {
                game.reset();
                board.start();
                $('#status').text('Game reset');
            });
        });
    </script>
</body>
</html>
