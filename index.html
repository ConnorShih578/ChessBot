<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trash Talk Chess Bot</title>

    <link rel="stylesheet" href="https://chessboardjs.com/css/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://chessboardjs.com/js/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }
        #board {
            width: 400px;
            margin: 20px auto;
        }
        #trashTalk {
            margin-top: 20px;
            color: #ff6b6b;
            font-style: italic;
            min-height: 40px;
        }
        #status {
            margin-top: 10px;
        }
        button {
            margin-top: 15px;
            padding: 8px 14px;
            background: #333;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h2>Trash Talk Chess Bot</h2>

<div id="board"></div>
<div id="status">Loading...</div>
<div id="trashTalk">"Let's see what you've got."</div>
<button id="resetBtn">Reset Game</button>

<script>
$(document).ready(function() {

    var board = null;
    var game = new Chess();
    var engine = null;

    var currentEval = 0.0;

    /* =========================
       ONLY COMMENTARY UPDATED
       ========================= */

    let lastLine = "";
    let lastEval = 0;
    let evalSwing = 0;

    function pickLine(list) {
        let line;
        do {
            line = list[Math.floor(Math.random() * list.length)];
        } while (line === lastLine && list.length > 1);
        lastLine = line;
        return line;
    }

    function updateEvalTrend(newEval) {
        evalSwing = newEval - lastEval;
        lastEval = newEval;
    }

    function getMoveContext(move) {
        if (!move) return null;

        if (move.flags.includes('c')) return 'capture';
        if (move.flags.includes('k') || move.flags.includes('q')) return 'castle';
        if (move.promotion) return 'promotion';
        if (move.san.includes('+')) return 'check_given';
        if (move.san.includes('#')) return 'mate';

        return 'normal';
    }

    function getGamePhase() {
        const moveCount = game.history().length;
        if (moveCount < 10) return 'opening';
        if (moveCount < 30) return 'middlegame';
        return 'endgame';
    }

    const openingBook = {
        "d4": "The London? Already playing it safe?",
        "e4": "King’s Pawn. Tutorial move detected.",
        "d4 d5 c4": "Queen’s Gambit. You think you’re in theory now?",
        "e4 c5": "Sicilian. At least you're trying.",
        "e4 e5 Nf3 Nc6 Bb5": "Ruy Lopez. Safe choice.",
        "e4 e6": "French Defense. You chose suffering early."
    };

    const situationalTalk = {
        botWinning: [
            "This is slipping away from you.",
            "You're slowly getting crushed.",
            "I barely need to think anymore.",
            "This is already winning."
        ],
        playerWinning: [
            "Temporary advantage. Nothing more.",
            "Enjoy it while it lasts.",
            "Even bad positions are recoverable—for me.",
            "Interesting... for now."
        ],
        check: [
            "Check.",
            "You're in check.",
            "That king is uncomfortable.",
            "Respond correctly."
        ],
        general: [
            "Interesting move.",
            "You're playing moves, at least.",
            "Hmm.",
            "We'll see."
        ],
        moveSpecific: {
            capture: [
                "You took something. Not bad.",
                "Trades already?",
                "That capture has consequences.",
                "Okay, aggressive."
            ],
            castle: [
                "You finally castled.",
                "King safety achieved... late.",
                "Standard move.",
                "Better late than never."
            ],
            promotion: [
                "A promotion. Now things change.",
                "New queen. Same problems.",
                "Let’s see if you can use it.",
                "That matters."
            ],
            check_given: [
                "You gave a check.",
                "Checks are easy.",
                "That changes little.",
                "Not threatening."
            ]
        },
        phase: {
            opening: [
                "Still in the opening.",
                "Book knowledge time.",
                "Don’t drift early."
            ],
            middlegame: [
                "Now it gets real.",
                "Calculation starts here.",
                "This is where mistakes happen."
            ],
            endgame: [
                "Endgame now.",
                "Precision matters.",
                "Let’s see technique."
            ]
        }
    };

    function getBotCommentary(lastMove = null) {

        if (Math.random() < 0.12) return "";

        const history = game.history().join(' ');
        if (openingBook[history]) return openingBook[history];

        if (evalSwing > 1.5) return "That just made things worse for you.";
        if (evalSwing < -1.5) return "Okay, that was actually decent.";

        const context = getMoveContext(lastMove);
        if (context && situationalTalk.moveSpecific[context]) {
            return pickLine(situationalTalk.moveSpecific[context]);
        }

        if (game.in_check()) {
            return pickLine(situationalTalk.check);
        }

        if (currentEval < -2.0) {
            return pickLine(situationalTalk.botWinning);
        }

        if (currentEval > 2.0) {
            return pickLine(situationalTalk.playerWinning);
        }

        if (Math.random() < 0.25) {
            const phase = getGamePhase();
            return pickLine(situationalTalk.phase[phase]);
        }

        return pickLine(situationalTalk.general);
    }

    /* =========================
       END COMMENTARY SECTION
       ========================= */

    try {
        engine = new Worker('./stockfish-18-lite-single.js');
        engine.postMessage('uci');
    } catch (e) {
        $('#status').text('Engine Error');
    }

    engine.onmessage = function(e) {
        const line = e.data;

        if (line.includes('score cp')) {
            const parts = line.split(' ');
            currentEval = parseInt(parts[parts.indexOf('cp') + 1]) / 100;
            updateEvalTrend(currentEval); // IMPORTANT ADDITION
        }

        if (line.startsWith('bestmove')) {
            const m = line.split(' ')[1];

            const move = game.move({
                from: m.substring(0, 2),
                to: m.substring(2, 4),
                promotion: 'q'
            });

            board.position(game.fen());
            $('#status').text('Your turn');

            $('#trashTalk').fadeOut(100, function() {
                $(this).text('"' + getBotCommentary(move) + '"').fadeIn(100);
            });
        }
    };

    function onDrop(source, target) {
        const move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (!move) return 'snapback';

        $('#status').text('Bot thinking...');

        const line = getBotCommentary(move);
        if (line) $('#trashTalk').text('"' + line + '"');

        setTimeout(function() {
            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go depth 15');
        }, 100);
    }

    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDrop: onDrop,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#resetBtn').on('click', function() {
        game.reset();
        board.start();
        $('#trashTalk').text('"Let’s see if you can do better this time."');
    });

});
</script>

</body>
</html>
