<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trash Talk Chess Bot</title>

    <!-- Chessboard.js -->
    <link rel="stylesheet" href="https://chessboardjs.com/css/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://chessboardjs.com/js/chessboard-1.0.0.min.js"></script>

    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }
        #board {
            width: 400px;
            margin: 20px auto;
        }
        #status {
            margin-top: 10px;
        }
        #trashTalk {
            margin-top: 20px;
            font-style: italic;
            color: #ff6b6b;
            min-height: 40px;
        }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Trash Talk Chess Bot</h2>

<div id="board"></div>
<div id="status">Loading...</div>
<div id="trashTalk">"Let's see what you've got."</div>
<button id="resetBtn">Reset Game</button>

<script>
$(document).ready(function() {

    var board = null;
    var game = new Chess();
    var engine = null;

    var currentEval = 0.0;
    let lastEval = 0;
    let swing = 0;
    let lastLine = "";

    const openingBook = {
        "e4": "King's Pawn. I've crushed this line thousands of times.",
        "d4": "A positional start. Let's see if you understand it.",
        "e4 e5 Nf3 Nc6 Bb5": "Ruy Lopez. Safe. Predictable.",
        "d4 d5 c4": "Queen's Gambit. You watched a video, didn't you?"
    };

    const situationalTalk = {
        botWinning: [
            "I'm barely trying and you're still collapsing.",
            "This is getting one-sided.",
            "The position is winning. You just don't see it yet."
        ],
        playerWinning: [
            "Temporary luck. Nothing more.",
            "You're ahead... which makes this more embarrassing when you lose.",
            "Even bad positions are winnable—for me."
        ],
        check: [
            "Check. Stay focused.",
            "You're in check. Try not to panic.",
            "That king looks uncomfortable."
        ],
        general: [
            "Interesting move.",
            "You're thinking... I assume.",
            "I've seen worse. Not often, though."
        ],
        moveSpecific: {
            capture: [
                "You found a capture. Impressive... for you.",
                "Trading pieces? Let's see who benefits.",
                "Sure, take it. That helps me more."
            ],
            castle: [
                "You finally castled.",
                "King safety. A bit late.",
                "Textbook move. Predictable."
            ],
            promotion: [
                "A promotion? Now it gets interesting.",
                "New queen. Same problems.",
                "Let's see if you can use it properly."
            ],
            check_given: [
                "You gave a check. Good job.",
                "Checks are easy. Winning isn't.",
                "That changes very little."
            ]
        },
        phase: {
            opening: [
                "We're still in theory.",
                "Try not to mess up the opening."
            ],
            middlegame: [
                "This is where things fall apart.",
                "Now it's about calculation."
            ],
            endgame: [
                "Endgame. Precision matters now.",
                "Let's see your technique."
            ]
        }
    };

    function pickLine(list) {
        let line;
        do {
            line = list[Math.floor(Math.random() * list.length)];
        } while (line === lastLine && list.length > 1);
        lastLine = line;
        return line;
    }

    function getGamePhase() {
        const moveCount = game.history().length;
        if (moveCount < 10) return 'opening';
        if (moveCount < 30) return 'middlegame';
        return 'endgame';
    }

    function getMoveContext(move) {
        if (!move) return null;

        if (move.flags.includes('c')) return 'capture';
        if (move.flags.includes('k') || move.flags.includes('q')) return 'castle';
        if (move.promotion) return 'promotion';
        if (move.san.includes('+')) return 'check_given';
        if (move.san.includes('#')) return 'mate';

        return 'normal';
    }

    function updateEvalTrend(newEval) {
        swing = newEval - lastEval;
        lastEval = newEval;
    }

    function getBotCommentary(lastMove = null) {

        if (Math.random() < 0.15) return "";

        const history = game.history().join(' ');
        if (openingBook[history]) return openingBook[history];

        if (swing > 1.5) return "That move just made things worse for you.";
        if (swing < -1.5) return "Okay, that was actually decent.";

        const context = getMoveContext(lastMove);
        if (context && situationalTalk.moveSpecific[context]) {
            return pickLine(situationalTalk.moveSpecific[context]);
        }

        if (game.in_check()) {
            return pickLine(situationalTalk.check);
        }

        if (currentEval < -2.0) {
            return pickLine(situationalTalk.botWinning);
        }

        if (currentEval > 2.0) {
            return pickLine(situationalTalk.playerWinning);
        }

        if (Math.random() < 0.3) {
            const phase = getGamePhase();
            return pickLine(situationalTalk.phase[phase]);
        }

        return pickLine(situationalTalk.general);
    }

    try {
        engine = new Worker('./stockfish-18-lite-single.js');
        engine.postMessage('uci');
    } catch (e) {
        $('#status').text('Engine failed to load.');
    }

    if (engine) {
        engine.onmessage = function(e) {
            const line = e.data;

            if (line.includes('score cp')) {
                const parts = line.split(' ');
                const newEval = parseInt(parts[parts.indexOf('cp') + 1]) / 100;
                updateEvalTrend(newEval);
                currentEval = newEval;
            }

            if (line.startsWith('bestmove')) {
                const m = line.split(' ')[1];

                const move = game.move({
                    from: m.substring(0, 2),
                    to: m.substring(2, 4),
                    promotion: 'q'
                });

                board.position(game.fen());
                $('#status').text('Your turn');

                $('#trashTalk').fadeOut(100, function() {
                    $(this).text('"' + getBotCommentary(move) + '"').fadeIn(100);
                });
            }
        };
    }

    function onDrop(source, target) {
        const move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';

        $('#status').text('Bot thinking...');

        const line = getBotCommentary(move);
        if (line) $('#trashTalk').text('"' + line + '"');

        setTimeout(function() {
            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go depth 15');
        }, 100);
    }

    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDrop: onDrop,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#resetBtn').on('click', function() {
        game.reset();
        board.start();
        $('#status').text('New Game');
        $('#trashTalk').text('"Try to last longer this time."');
    });

});
</script>

</body>
</html>
