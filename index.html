<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess vs Stockfish</title>
    <!-- 1. Fixed CSS Link -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #myBoard { width: 400px; border: 2px solid #333; }
        .controls { margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="myBoard"></div>
    <div class="controls">
        <p id="status">Status: Loading...</p>
        <button id="resetBtn">New Game</button>
    </div>

    <!-- 2. Fixed Script Links (Direct files, not folders) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            
            // Ensure this filename is EXACTLY what is in your Netlify folder
            var engine = new Worker('stockfish-18-lite-single.js');

            function onDrop(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 15');
                $('#status').text('Stockfish is thinking...');
            }

            var config = {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                pieceTheme: 'https://chessboardjs.com{piece}.png'
            };

            board = Chessboard('myBoard', config);
            $('#status').text('Your Turn');

            engine.onmessage = function(e) {
                if (e.data.startsWith('bestmove')) {
                    var moveData = e.data.split(' ');
                    var moveStr = moveData[1]; // Get "e2e4"
                    
                    game.move({ 
                        from: moveStr.substring(0, 2), 
                        to: moveStr.substring(2, 4), 
                        promotion: 'q' 
                    });
                    
                    board.position(game.fen());
                    $('#status').text('Your Turn');
                }
            };

            $('#resetBtn').on('click', function() {
                game.reset();
                board.start();
                $('#status').text('New Game Started');
            });
        });
    </script>
</body>
</html>
