<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess vs Stockfish</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding-top: 30px; font-family: sans-serif; }
        #board { width: 400px; max-width: 90vw; }
    </style>
</head>
<body>
    <div id="board"></div>
    <p id="status">Ready to play</p>

    <!-- Essential Scripts -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        var board = null;
        var game = new Chess();
        
        // This is the part that worked earlier
        var sf = new Worker('stockfish-18-lite-single.js');

        sf.onmessage = function(e) {
            console.log(e.data);
            if (e.data.startsWith('bestmove')) {
                var parts = e.data.split(' ');
                var move = parts[1]; // Get the actual move string like "e2e4"
                
                game.move({ 
                    from: move.substring(0, 2), 
                    to: move.substring(2, 4), 
                    promotion: 'q' 
                });
                
                board.position(game.fen());
                document.getElementById('status').innerText = "Your Turn";
            }
        };

        var config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com{piece}.png',
            onDrop: function(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                document.getElementById('status').innerText = "Thinking...";
                sf.postMessage('position fen ' + game.fen());
                sf.postMessage('go depth 15');
            }
        };

        board = Chessboard('board', config);
    </script>
</body>
</html>
