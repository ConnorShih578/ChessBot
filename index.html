<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess Test</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding-top: 50px; font-family: sans-serif; }
        #myBoard { width: 400px; height: 400px; border: 2px solid #333; background: #eee; }
    </style>
</head>
<body>
    <div id="myBoard"></div>
    <p id="status">Status: Initializing...</p>
    <button onclick="location.reload()">Reload Page</button>

    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        $(document).ready(function() {
            console.log("Step 1: HTML Loaded");
            var game = new Chess();
            var board = null;
            var engine = null;

            try {
                // Initialize the worker
                engine = new Worker('stockfish-18-lite-single.js');
                console.log("Step 2: Worker Script Found");
                
                engine.onmessage = function(e) {
                    console.log("Engine Message:", e.data);
                    if (e.data.startsWith('bestmove')) {
                        var move = e.data.split(' ');
                        game.move({ from: move.substring(0, 2), to: move.substring(2, 4), promotion: 'q' });
                        board.position(game.fen());
                        $('#status').text('Your Turn');
                    }
                };

                // Check if engine is ready
                engine.postMessage('uci');
                setTimeout(() => { $('#status').text('Ready to Play!'); }, 1000);

            } catch (err) {
                console.error("Step 2 FAILED:", err);
                $('#status').text('Error: Worker blocked or missing.');
            }

            board = Chessboard('myBoard', {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com{piece}.png',
                onDrop: function(source, target) {
                    var move = game.move({ from: source, to: target, promotion: 'q' });
                    if (move === null) return 'snapback';
                    
                    $('#status').text('Stockfish thinking...');
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 15');
                }
            });
        });
    </script>
</body>
</html>
