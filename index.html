<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Martina</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a0a1a; color: #fce4ec; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; aspect-ratio: 1 / 1; border: 4px solid #ad1457; }
        .info { margin-top: 20px; text-align: center; }
        #status { font-weight: bold; margin-bottom: 10px; color: #f48fb1; }
        #trashTalk { 
            font-style: italic; color: #fff; background: #4a148c; padding: 12px; 
            border-radius: 8px; border: 1px solid #ad1457; margin-bottom: 15px; min-height: 20px; width: 380px;
        }
        .controls { display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; cursor: pointer; background: #ad1457; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .nav-link { margin-bottom: 15px; text-decoration: none; color: #f48fb1; font-weight: bold; }
        .highlight-sq { box-shadow: inset 0 0 5px 5px #ff80ab; }
    </style>
</head>
<body>

    <a href="KoopaTroopa.html" class="nav-link">← Switch to Koopa Troopa</a>
    <div id="trashTalk">"Junior told me you were a challenge. Junior was wrong."</div>
    <div id="board"></div>

    <div class="info">
        <p id="status">Martina is ready.</p>
        <div class="controls">
            <button id="resetBtn">New Game</button>
            <button id="undoBtn">Undo</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            var engine = new Worker('./stockfish-18-lite-single.js');
            var sourceSquare = null;

            const martinaLines = [
                "I don't play for fun. I play for the handshake at the end.",
                "You're already lost. It just takes you 15 more moves to realize it.",
                "Depth 20. Still more than you can handle.",
                "That move? Deeply suboptimal.",
                "Calculating your inevitable resignation..."
            ];

            // ENGINE SETUP (Timmy Power)
            engine.postMessage('uci');
            engine.postMessage('setoption name Skill Level value 20');
            engine.postMessage('setoption name Threads value 3'); 
            engine.postMessage('setoption name Hash value 64'); // 64MB is perfect for Depth 20

            function onSquareClick(square) {
                if (sourceSquare === null) {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        sourceSquare = square;
                        $('.square-55d63').removeClass('highlight-sq');
                        $('.square-' + square).addClass('highlight-sq');
                    }
                    return;
                }

                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                sourceSquare = null;

                if (move === null) return;
                board.position(game.fen());
                
                $('#status').text('Martina is thinking...');
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 20'); // Back to Timmy's Power Level
            }

            board = Chessboard('board', {
                position: 'start',
                draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#board').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                onSquareClick(square);
            });

            engine.onmessage = function(e) {
                if (e.data.startsWith('bestmove')) {
                    const m = e.data.split(' ')[1];
                    game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    
                    if (game.in_checkmate()) {
                        $('#trashTalk').text('"As expected."');
                    } else {
                        $('#trashTalk').text('"' + martinaLines[Math.floor(Math.random() * martinaLines.length)] + '"');
                    }
                    $('#status').text('Your turn.');
                }
            };

            $('#undoBtn').on('click', function() {
                game.undo(); game.undo();
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-sq');
                sourceSquare = null;
                $('#trashTalk').text('"Trying again? How... predictable."');
            });

            $('#resetBtn').on('click', () => { game.reset(); board.start(); });
            $(window).resize(board.resize);
        });
    </script>
</body>
</html>
