<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Martina</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a0a1a; color: #fce4ec; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; border: 4px solid #ad1457; box-shadow: 0 0 20px rgba(173, 20, 87, 0.3); }
        #trashTalk { background: #4a148c; padding: 15px; border-radius: 8px; border: 1px solid #ad1457; margin-bottom: 15px; width: 380px; text-align: center; min-height: 24px; font-weight: 300; letter-spacing: 0.5px; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px #f48fb1; }
        .highlight-last { background-color: rgba(173, 20, 87, 0.5) !important; }
        .nav-link { text-decoration: none; color: #f48fb1; font-weight: bold; margin-bottom: 20px; font-size: 0.9em; }
        button { margin-top: 25px; padding: 12px 24px; background: #ad1457; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #eval-status { font-size: 0.7em; color: #ad1457; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <a href="cooper.html" class="nav-link">← Go Against Koopa Troopa</a>
    <div id="trashTalk">"Junior told me you were a challenge. Junior was wrong."</div>
    <div id="board"></div>
    <div id="eval-status">System: Optimal</div>
    <button onclick="location.reload()">Reset Position</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, currentEval = 0.0;

        const martinaLines = [
            "I don't play for fun. I play for the handshake at the end.",
            "Calculating your inevitable resignation...",
            "That move? Deeply suboptimal.",
            "Predictable. Efficient. Final.",
            "You are fighting against math. Math always wins."
        ];

        engine.postMessage('uci');
        engine.postMessage('setoption name Skill Level value 20');
        engine.postMessage('setoption name Threads value 1');

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 20');
                    $('#trashTalk').text('"Analyzing..."');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                let score = parseInt(e.data.split('cp ')[1].split(' ')[0]);
                currentEval = (game.turn() === 'b' ? score : -score) / 100;
                $('#eval-status').text('Deviation: ' + currentEval.toFixed(1));
            }
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                
                // Commentary Logic
                if (game.in_checkmate()) {
                    $('#trashTalk').text('"As expected. Goodbye."');
                } else if (currentEval > 3.0) {
                    $('#trashTalk').text('"Your position is mathematically unsalvageable."');
                } else if (currentEval < -1.5) {
                    $('#trashTalk').text('"A temporary anomaly. Recalibrating."');
                } else {
                    $('#trashTalk').text('"' + martinaLines[Math.floor(Math.random() * martinaLines.length)] + '"');
                }
            }
        };

        $(document).ready(function() {
            board = Chessboard('board', { 
                position: 'start', 
                draggable: false, 
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
            });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
