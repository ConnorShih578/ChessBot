<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Martina</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a0a1a; color: #fce4ec; padding-top: 20px; }
        #board { width: 400px; border: 4px solid #ad1457; }
        #trashTalk { background: #4a148c; padding: 12px; border-radius: 8px; border: 1px solid #ad1457; margin-bottom: 15px; width: 380px; text-align: center; }
        .highlight-last { background-color: rgba(173, 20, 87, 0.5) !important; }
        button { padding: 10px 20px; background: #ad1457; color: white; border: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="trashTalk">"Junior told me you were a challenge. Junior was wrong."</div>
    <div id="board"></div>
    <div style="margin-top:20px;">
        <button onclick="location.reload()">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), sourceSquare = null;
        var engine = new Worker('./stockfish-18-lite-single.js');

        const martinaLines = [
            "I don't play for fun. I play for the handshake at the end.",
            "You're already lost. It just takes you 15 more moves to realize it.",
            "Calculating your inevitable resignation...",
            "That move? Deeply suboptimal.",
            "Depth 18. Still more than you can handle."
        ];

        engine.postMessage('uci');
        engine.postMessage('setoption name Threads value 1');
        engine.postMessage('setoption name Hash value 16');

        function onSquareClick(square) {
            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
                return;
            }
            var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            $('.square-55d63').removeClass('highlight-sq');
            if (move) {
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-' + move.from + ', .square-' + move.to).addClass('highlight-last');
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 18');
            }
            sourceSquare = null;
        }

        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-' + m.substring(0, 2) + ', .square-' + m.substring(2, 4)).addClass('highlight-last');
                if (game.in_checkmate()) {
                    $('#trashTalk').text('"As expected."');
                } else {
                    $('#trashTalk').text('"' + martinaLines[Math.floor(Math.random() * martinaLines.length)] + '"');
                }
            }
        };

        board = Chessboard('board', { position: 'start', draggable: false });
        $('#board').on('click', '.square-55d63', function() { onSquareClick($(this).attr('data-square')); });
    </script>
</body>
</html>
