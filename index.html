```
<div id="board"></div>

<div class="info">
    <p id="status">Loading Engine...</p>
    <button id="resetBtn">New Game</button>
</div>

<!-- Scripts (ORDER MATTERS) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
    $(document).ready(function() {

        var board = null;
        var game = new Chess();
        var engine = null;

        // Initialize Stockfish Worker
        try {
            engine = new Worker('./stockfish-18-lite-single.js');
            engine.postMessage('uci');
            console.log("Worker initialized.");
        } catch (e) {
            $('#status').text('Engine Error: Worker failed to load.');
            console.error(e);
        }

        // Handle engine messages SAFELY
        if (engine) {
            engine.onmessage = function(e) {
                const line = (typeof e.data === 'string') ? e.data : '';
                if (!line) return;

                console.log("Engine:", line);

                if (line.includes('uciok') || line.includes('readyok')) {
                    $('#status').text('Ready! Your turn.');
                }

                if (line.startsWith('bestmove')) {
                    const parts = line.split(' ');
                    if (parts.length < 2) return;

                    const m = parts[1];
                    if (!m || m === '(none)') return;

                    game.move({
                        from: m.substring(0, 2),
                        to: m.substring(2, 4),
                        promotion: 'q'
                    });

                    board.position(game.fen());
                    $('#status').text('Your turn');
                }
            };
        }

        // Handle player move
        function onDrop(source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            $('#status').text('Stockfish thinking...');

            setTimeout(function() {
                if (!engine) return;

                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 15');
            }, 100);
        }

        // Initialize board
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Reset game
        $('#resetBtn').on('click', function() {
            game.reset();
            board.start();
            $('#status').text('New Game Started');
        });

    });
</script>
