<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Stockfish 18</title>
    
    <!-- 1. External CSS (Board Theme) -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #ececec; padding: 20px; }
        #board { width: 400px; max-width: 95vw; border: 4px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .controls { margin-top: 20px; text-align: center; }
        #status { font-weight: bold; color: #444; margin-bottom: 10px; height: 1.2em; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background: #2c3e50; color: white; }
        button:hover { background: #34495e; }
    </style>
</head>
<body>

    <div id="board"></div>

    <div class="controls">
        <p id="status">Waking up engine...</p>
        <button id="resetBtn">New Game</button>
    </div>

    <!-- 2. Essential JS Libraries (CDNs) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            var engine;

            // 3. Start Stockfish Worker
            try {
                // IMPORTANT: These files MUST be in your Netlify folder
                engine = new Worker('stockfish-18-lite-single.js');
                
                // Initialize engine communication
                engine.postMessage('uci');
                engine.postMessage('isready'); 
                console.log("Worker created, waiting for response...");
            } catch (e) {
                $('#status').text('Error: Worker blocked.');
                console.error(e);
            }

            // 4. Handle Engine Messages
            engine.onmessage = function(event) {
                var line = event.data;
                console.log("SF:", line);

                if (line === 'readyok') {
                    $('#status').text('Engine Ready! Your move.');
                }

                if (line.startsWith('bestmove')) {
                    var m = line.split(' ')[1]; // Get "e2e4"
                    game.move({
                        from: m.substring(0, 2),
                        to: m.substring(2, 4),
                        promotion: 'q'
                    });
                    board.position(game.fen());
                    $('#status').text('Your Turn');
                }
            };

            // 5. User Interaction logic
            function onDrop(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                
                if (move === null) return 'snapback'; // Illegal move

                $('#status').text('Stockfish thinking...');
                
                // Send board state to engine
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 15');
            }

            // 6. Initialize the Board
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                pieceTheme: 'https://chessboardjs.com{piece}.png'
            });

            // 7. Reset Handler
            $('#resetBtn').on('click', function() {
                game.reset();
                board.start();
                $('#status').text('New Game Started');
                engine.postMessage('ucinewgame');
            });
        });
    </script>
</body>
</html>
