<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Stockfish 18</title>
    
    <!-- 1. CSS for the Board (Reliable JSDelivr link) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; border: 4px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .info { margin-top: 20px; text-align: center; }
        #status { font-weight: bold; margin-bottom: 10px; }
        button { padding: 10px 25px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="board"></div>

    <div class="info">
        <p id="status">Loading Engine...</p>
        <button id="resetBtn">New Game</button>
    </div>

    <!-- 2. Scripts at the BOTTOM to prevent page-load hanging -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            var engine;

            // Step 1: Initialize Engine
            try {
                // Must match your exact filename
                engine = new Worker('stockfish-18-lite-single.js');
                engine.postMessage('uci');
                console.log("Worker initialized.");
            } catch (e) {
                $('#status').text('Engine Error: Worker missing.');
                console.error(e);
            }

            // Step 2: Handle Engine Output
            engine.onmessage = function(e) {
                if (e.data === 'uciok') {
                    $('#status').text('Ready! Your turn.');
                }
                
                if (e.data.startsWith('bestmove')) {
                    var m = e.data.split(' ')[1]; // Get move like "e2e4"
                    game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    $('#status').text('Your turn');
                }
            };

            // Step 3: Piece Movement
            function onDrop(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                $('#status').text('Stockfish thinking...');
                
                // Slight delay to ensure the board renders the move before engine starts heavy thinking
                window.setTimeout(function() {
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 15');
                }, 100);
            }

            // Step 4: Initialize Board
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                // Loads pieces from official CDN
                pieceTheme: 'https://chessboardjs.com{piece}.png'
            });

            $('#resetBtn').on('click', function() {
                game.reset();
                board.start();
                $('#status').text('New Game Started');
            });
        });
    </script>
</body>
</html>
