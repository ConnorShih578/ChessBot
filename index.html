<!DOCTYPE html>
<html>
<head>
    <title>Stockfish Chess Board</title>
    <!-- 1. Load CSS -->
    <link rel="stylesheet" href="https://unpkg.com">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        /* The container MUST have a width for the board to appear */
        #myBoard { width: 400px; border: 2px solid #333; } 
    </style>
</head>
<body>

    <div id="myBoard"></div>
    <div style="margin: 20px;">
        <button id="resetBtn">New Game</button>
        <p id="status">Status: Ready</p>
    </div>

    <!-- 2. Load jQuery FIRST -->
    <script src="https://jquery.com"></script>
    <!-- 3. Load Chessboard.js SECOND -->
    <script src="https://unpkg.com"></script>
    <!-- 4. Load Chess.js THIRD -->
    <script src="https://cloudflare.com"></script>

    <script>
        // Wrap everything in a "ready" function
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            const engine = new Worker('stockfish-18-lite-single.js');

            function onDrop(source, target) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';

                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 15');
                $('#status').text('Stockfish is thinking...');
            }

            var config = {
                draggable: true,
                position: 'start',
                onDrop: onDrop
            };

            // Initialize the board
            board = Chessboard('myBoard', config);

            engine.onmessage = function(e) {
                if (e.data.startsWith('bestmove')) {
                    const moveStr = e.data.split(' ')[1];
                    game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    $('#status').text('Your turn');
                }
            };

            $('#resetBtn').on('click', function() {
                game.reset();
                board.start();
                $('#status').text('Game reset');
            });
        });
    </script>
</body>
</html>
