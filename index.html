<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Timmy (Grandmaster)</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #eceff1; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; aspect-ratio: 1 / 1; border: 4px solid #263238; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .info { margin-top: 20px; text-align: center; }
        #status { font-weight: bold; margin-bottom: 10px; color: #263238; }
        #trashTalk { 
            font-style: italic; color: #fff; background: #263238; padding: 12px; 
            border-radius: 8px; margin-bottom: 15px; min-height: 20px; width: 380px;
        }
        .controls { display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; cursor: pointer; background: #263238; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #455a64; }
        .nav-link { margin-bottom: 15px; text-decoration: none; color: #546e7a; font-weight: bold; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px cyan; } /* Timmy uses a cold blue highlight */
    </style>
</head>
<body>

    <a href="Cooper.html" class="nav-link">Switch to Koopa Troopa →</a>
    <div id="trashTalk">"Oh, you again? Try not to lose in five moves this time."</div>
    <div id="board"></div>

    <div class="info">
        <p id="status">Timmy is ready to humiliate you.</p>
        <div class="controls">
            <button id="resetBtn">New Game</button>
            <button id="undoBtn">Undo (Cheater!)</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            var engine = null;
            var sourceSquare = null;

            const timmyInsults = [
                "Is that your best? My grandmother plays faster than you.",
                "I've calculated 4 million ways you lose. Pick one.",
                "You're actually going to play that? Interesting... for a beginner.",
                "I'm bored. Can we speed this up?",
                "That move was a mistake. You just don't know why yet.",
                "Wait, are you actually trying to win? That's adorable."
            ];

            function onSquareClick(square) {
                if (sourceSquare === null) {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        sourceSquare = square;
                        $('.square-55d63').removeClass('highlight-sq');
                        $('.square-' + square).addClass('highlight-sq');
                    }
                    return;
                }

                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                sourceSquare = null;

                if (move === null) return;

                board.position(game.fen());
                if (game.in_checkmate()) {
                    $('#trashTalk').text('"How... how did you beat me? This engine must be buggy!"');
                    return;
                }

                $('#status').text('Timmy is laughing at your position...');
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 20'); // Higher depth for Timmy
            }

            board = Chessboard('board', {
                position: 'start',
                draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#board').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                onSquareClick(square);
            });

            engine = new Worker('./stockfish-18-lite-single.js');
            engine.postMessage('uci');
            engine.postMessage('setoption name Hash value 128'); // More memory

            engine.onmessage = function(e) {
                if (e.data.startsWith('bestmove')) {
                    const m = e.data.split(' ')[1];
                    game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    
                    if (game.in_checkmate()) {
                        $('#trashTalk').text('"Checkmate. Stick to checkers next time."');
                    } else {
                        $('#trashTalk').text('"' + timmyInsults[Math.floor(Math.random() * timmyInsults.length)] + '"');
                    }
                    $('#status').text('Your turn.');
                }
            };

            $('#undoBtn').on('click', function() {
                game.undo(); // Undo Timmy
                game.undo(); // Undo You
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-sq');
                sourceSquare = null;
                $('#trashTalk').text('"Undoing moves? That’s 100% cheating. I’m telling everyone."');
            });

            $('#resetBtn').on('click', () => { game.reset(); board.start(); $('#trashTalk').text('"Ready for round two? I hope you practiced."'); });
            $(window).resize(board.resize);
        });
    </script>
</body>
</html>
