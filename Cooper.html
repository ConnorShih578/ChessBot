<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Koopa Troopa</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #fffde7; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; aspect-ratio: 1 / 1; border: 4px solid #fbc02d; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .info { margin-top: 20px; text-align: center; }
        #status { font-weight: bold; margin-bottom: 10px; color: #f57f17; }
        #trashTalk { 
            font-style: italic; color: #333; background: white; padding: 10px; 
            border-radius: 8px; border: 2px solid #fbc02d; margin-bottom: 15px; min-height: 20px; width: 380px;
        }
        .controls { display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; cursor: pointer; background: #fbc02d; color: #333; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #f9a825; }
        .nav-link { margin-bottom: 15px; text-decoration: none; color: #f57f17; font-weight: bold; }
        /* Highlight for selected square */
        .highlight-sq { box-shadow: inset 0 0 3px 3px yellow; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">← Switch to Timmy</a>
    <div id="trashTalk">"He he he! King Koopa Troopa is in the building!"</div>
    <div id="board"></div>

    <div class="info">
        <p id="status">Loading Koopa Troopa...</p>
        <div class="controls">
            <button id="resetBtn">New Game</button>
            <button id="undoBtn">Undo Move</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            var engine = null;
            var currentEval = 0.0;
            var lastEval = 0.0;
            var sourceSquare = null; // Track first click

            const theoryMoves = {
                "d4": { move: "e5", talk: "Englund Gambit! Prepare to be confused! He he he!" },
                "d4 e5 dxe5": { move: "Nc6", talk: "Developing the Troopa pony. He he he!" },
                "e4": { move: "c5", talk: "Sicilian! I like this. It’s mischievous, just like me. He he he!" }
            };

            const randomFacts = [
                "all hail King Koopa Troopa!",
                "Did you know Napoleon Bonaparte was actually 5'6\"?",
                "Napoleon once was attacked by a colony of rabbits. He he he!",
                "I am the King of the Troopas! My logic is as sound as the Napoleonic Code."
            ];

            function getBotCommentary() {
                if (game.in_checkmate()) return game.turn() === 'w' ? "He he he! King Koopa Troopa wins!" : "我头痛！ This board is rigged.";
                if (game.in_check()) return "Check, whatcha gonna do about it? Cwy??";
                if ((currentEval - lastEval) > 1.5) return "He he he he he, I see You just blundered!";
                if (currentEval < -2.5) return "我头痛！";
                if (currentEval < -0.8) return "You think you're winning?? You're not!";
                return randomFacts[Math.floor(Math.random() * randomFacts.length)];
            }

            // Click-to-Move Logic
            function onSquareClick(square) {
                // 1. If it's the first click (selecting a piece)
                if (sourceSquare === null) {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        sourceSquare = square;
                        $('.square-55d63').removeClass('highlight-sq');
                        $('.square-' + square).addClass('highlight-sq');
                    }
                    return;
                }

                // 2. If it's the second click (selecting target)
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                
                $('.square-55d63').removeClass('highlight-sq');
                sourceSquare = null;

                if (move === null) return; // Invalid move

                board.position(game.fen());
                handleBotMove();
            }

            function handleBotMove() {
                const historyString = game.history().join(' ');

                // Check Theory
                if (theoryMoves[historyString]) {
                    const tMove = theoryMoves[historyString];
                    setTimeout(() => {
                        game.move(tMove.move);
                        board.position(game.fen());
                        $('#trashTalk').text('"' + tMove.talk + '"');
                    }, 600);
                    return;
                }

                // Run Engine
                $('#status').text('Koopa is thinking...');
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('setoption name Skill Level value 4'); //Skill level
                engine.postMessage('go depth 6'); //Search depth
            }

            // Initialize Board
            board = Chessboard('board', {
                position: 'start',
                draggable: false, // DISABLE DRAG FOR CLICK-MOVE
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            // Listen for clicks on the squares
            $('#board').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                onSquareClick(square);
            });

            // Engine Setup
            engine = new Worker('./stockfish-18-lite-single.js');
            engine.onmessage = function(e) {
                if (e.data.includes('score cp')) {
                    const parts = e.data.split(' ');
                    lastEval = currentEval;
                    currentEval = parseInt(parts[parts.indexOf('cp') + 1]) / 100;
                }
                if (e.data.startsWith('bestmove')) {
                    const m = e.data.split(' ')[1];
                    game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    $('#trashTalk').text('"' + getBotCommentary() + '"');
                    $('#status').text('Your turn');
                }
            };

            // Undo Button (Undoes YOUR move AND the Bot's move)
            $('#undoBtn').on('click', function() {
                game.undo(); // Undo Bot's move
                game.undo(); // Undo Your move
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-sq');
                sourceSquare = null;
                $('#trashTalk').text('"Wait, you\'re taking it back? 我头痛！"');
            });

            $('#resetBtn').on('click', () => { game.reset(); board.start(); });
            $(window).resize(board.resize);
        });
    </script>
</body>
</html>
