<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess vs Koopa Troopa</title>

<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>
:root { --bg: #fffde7; --side: #fff9c4; --text: #5f4b00; --yellow: #fbc02d; --orange: #f57f17; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
#game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 15px; }
#board { width: 550px; border: 8px solid var(--yellow); border-radius: 12px; }
#sidebar { flex: 1; background: var(--side); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; border: 4px solid var(--yellow); }
#chat-window { flex: 1; background: white; border-radius: 12px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--yellow); display: flex; flex-direction: column; gap: 8px; }
.bubble { background: #fff9c4; padding: 10px; border-radius: 15px; border: 1px solid var(--yellow); }
button { padding: 12px; cursor: pointer; background: var(--yellow); border: none; border-radius: 10px; font-weight: bold; box-shadow: 0 3px 0 var(--orange); }
.highlight-sq { box-shadow: inset 0 0 3px 3px #fbc02d; }
</style>
</head>

<body>

<div id="game-container">
    <div id="board"></div>

    <div id="sidebar">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
            <span style="font-size:2em;">🐢</span>
            <h3>King Koopa</h3>
        </div>
        <div id="chat-window"></div>
        <button onclick="location.reload()">Rematch!</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
var board = null,
    game = new Chess(),
    engine = new Worker('https://cdn.jsdelivr.net/npm/stockfish/stockfish.js'),
    sourceSquare = null,
    currentEval = 0,
    lastEval = 0;

engine.postMessage('uci');
engine.postMessage('setoption name UCI_Elo value 1350');

const quotes = {
    winning: ["He he he! My shell is too tough for you!", "All my Koopas are going to be so proud of me!", "Are you sure you know how the horsey moves?", "I'm the king of the board! He he he!"],
    losing: ["我头痛！ This isn't fair!", "Stop that! You're making my shell rattle!", "I'm going to tell Bowser you're mean!", "Is that move even legal? He he he... no it's not!"],
    neutral: [
        "Did you know Napoleon was once attacked by rabbits? He he he!",
        "I'm not just a shell, I'm a mastermind! He he he!",
        "Napoleon actually loved chess, but he was kind of bad at it. Just like you!",
        "All hail King Koopa Troopa!",
        "I'm thinking... but it's mostly about lettuce. He he he!",
        "Did you know that Napoleon wore a necklace with a vial of poison attched in case he got captured?"
    ],
    victory: ["I WON! I WON! He he he!", "Next stop: Timchess.netlify.app!", "You got Koopa'd!"]
};

function speak(text) {
    const chat = $('#chat-window');
    chat.append(`<div class="bubble">${text}</div>`);
    setTimeout(() => {
        chat.scrollTop(chat[0].scrollHeight);
    }, 0);
}

function onSquareClick() {
    var square = $(this).attr('data-square');
    if (game.game_over()) return;

    if (sourceSquare === null) {
        var piece = game.get(square);
        if (piece && piece.color === 'w') {
            sourceSquare = square;
            $('.square-55d63').removeClass('highlight-sq');
            $('.square-' + square).addClass('highlight-sq');
        }
    } else {
        var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
        $('.square-55d63').removeClass('highlight-sq');

        if (move) {
            board.position(game.fen());
            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go movetime 800');
        }
        sourceSquare = null;
    }
}

engine.onmessage = function(e) {
    let line = e.data;

    // ✅ FIXED eval parsing
    if (line.includes('score cp')) {
        let match = line.match(/score cp (-?\d+)/);
        if (match) {
            let score = parseInt(match[1]);
            currentEval = (game.turn() === 'b' ? score : -score) / 100;
        }
    }

    if (line.startsWith('bestmove')) {
        let m = line.split(' ')[1];
        if (!m || m === '(none)') return;

        game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
        board.position(game.fen());

        // ✅ FIXED timing (THIS is the key)
        setTimeout(() => {
            let cat = 'neutral';

            if (currentEval < -1.5) cat = 'winning';
            else if (currentEval > 1.5) cat = 'losing';

            // slight dynamic improvement (still uses your lines)
            let delta = currentEval - lastEval;
            if (delta < -2) cat = 'winning';
            else if (delta > 2) cat = 'losing';

            lastEval = currentEval;

            speak(
                game.in_checkmate()
                    ? quotes.victory[0]
                    : quotes[cat][Math.floor(Math.random() * quotes[cat].length)]
            );
        }, 150);
    }
};

$(document).ready(function() {
    board = Chessboard('board', {
        position: 'start',
        draggable: false,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $(document).on('click', '.square-55d63', onSquareClick);

    speak("He he he! King Koopa Troopa is in the building!");
});
</script>

</body>
</html>
