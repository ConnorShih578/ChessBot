<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Koopa Troopa</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #fffde7; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; border: 4px solid #fbc02d; }
        #trashTalk { font-style: italic; color: #333; background: white; padding: 10px; border-radius: 8px; border: 2px solid #fbc02d; margin-bottom: 15px; width: 380px; text-align: center; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px yellow; }
        .highlight-last { background-color: rgba(251, 192, 45, 0.5) !important; }
        button { padding: 10px 20px; cursor: pointer; background: #fbc02d; border: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="trashTalk">"He he he! King Koopa Troopa is in the building!"</div>
    <div id="board"></div>
    <div style="margin-top:20px;">
        <button onclick="game.undo(); game.undo(); board.position(game.fen()); $('.square-55d63').removeClass('highlight-last');">Undo</button>
        <button onclick="location.reload()">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), sourceSquare = null;
        var engine = new Worker('./stockfish-18-lite-single.js');

        function highlight(from, to) {
            $('.square-55d63').removeClass('highlight-last');
            $('.square-' + from).addClass('highlight-last');
            $('.square-' + to).addClass('highlight-last');
        }

        const theory = { "d4": { m: "e5", t: "Englund Gambit! He he he!" }, "e4": { m: "c5", t: "Sicilian! Mischievous! He he he!" } };

        function onSquareClick(square) {
            if (sourceSquare === null) {
                if (game.get(square) && game.get(square).color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    highlight(move.from, move.to);
                    const hist = game.history().join(' ');
                    if (theory[hist]) {
                        setTimeout(() => { 
                            let tm = game.move(theory[hist].m); 
                            board.position(game.fen()); 
                            highlight(tm.from, tm.to);
                            $('#trashTalk').text('"' + theory[hist].t + '"');
                        }, 500);
                    } else {
                        engine.postMessage('position fen ' + game.fen());
                        engine.postMessage('go depth 6');
                    }
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                highlight(m.substring(0, 2), m.substring(2, 4));
                $('#trashTalk').text('"All hail King Koopa Troopa!"');
            }
        };

        board = Chessboard('board', { position: 'start', draggable: false });
        $('#board').on('click', '.square-55d63', function() { onSquareClick($(this).attr('data-square')); });
    </script>
</body>
</html>
