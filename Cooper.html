<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Koopa Troopa</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #fffde7; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; border: 4px solid #fbc02d; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #trashTalk { font-style: italic; color: #333; background: white; padding: 10px; border-radius: 8px; border: 2px solid #fbc02d; margin-bottom: 15px; min-height: 20px; width: 380px; text-align: center; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px yellow; }
        .highlight-last { background-color: rgba(251, 192, 45, 0.5) !important; }
        .nav-link { margin-bottom: 15px; text-decoration: none; color: #f57f17; font-weight: bold; }
        button { padding: 10px 20px; cursor: pointer; background: #fbc02d; border: none; border-radius: 4px; font-weight: bold; margin: 5px; }
    </style>
</head>
<body>
    <a href="kedin.html" class="nav-link">← Switch to Gween Fwog</a>
    <div id="trashTalk">"He he he! King Koopa Troopa is in the building!"</div>
    <div id="board"></div>
    <div style="margin-top:20px;">
        <button onclick="game.undo(); game.undo(); board.position(game.fen()); $('.square-55d63').removeClass('highlight-last'); $('#trashTalk').text('Wait, you\'re taking it back? 我头痛！');">Undo Move</button>
        <button onclick="location.reload()">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), sourceSquare = null;
        var engine = new Worker('./stockfish-18-lite-single.js');
        var currentEval = 0.0, lastEval = 0.0;

        const theoryMoves = {
            "d4": { move: "e5", talk: "Englund Gambit! Prepare to be confused! He he he!" },
            "d4 e5 dxe5": { move: "Nc6", talk: "Developing the Troopa pony. He he he!" },
            "e4": { move: "c5", talk: "Sicilian! I like this. It’s mischievous. He he he!" }
        };

        const randomFacts = [
            "all hail King Koopa Troopa!",
            "Did you know Napoleon Bonaparte was actually 5'6\"?",
            "Napoleon once was attacked by a colony of rabbits. He he he!",
            "I am the King of the Troopas! My logic is as sound as the Napoleonic Code."
        ];

        function getBotCommentary() {
            if (game.in_checkmate()) return game.turn() === 'w' ? "He he he! King Koopa Troopa wins!" : "我头痛！ This board is rigged.";
            if (game.in_check()) return "Check, whatcha gonna do about it? Cwy??";
            if ((currentEval - lastEval) > 1.5) return "He he he he he, I see You just blundered!";
            if (currentEval < -2.5) return "我头痛！";
            return randomFacts[Math.floor(Math.random() * randomFacts.length)];
        }

        function highlight(from, to) {
            $('.square-55d63').removeClass('highlight-last');
            $('.square-' + from + ', .square-' + to).addClass('highlight-last');
        }

        function onSquareClick(square) {
            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
                return;
            }
            var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            $('.square-55d63').removeClass('highlight-sq');
            if (move) {
                board.position(game.fen());
                highlight(move.from, move.to);
                const history = game.history().join(' ');
                if (theoryMoves[history]) {
                    setTimeout(() => {
                        let tm = game.move(theoryMoves[history].move);
                        board.position(game.fen());
                        highlight(tm.from, tm.to);
                        $('#trashTalk').text('"' + theoryMoves[history].talk + '"');
                    }, 600);
                } else {
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 6');
                }
            }
            sourceSquare = null;
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                lastEval = currentEval;
                currentEval = parseInt(e.data.split('cp ')[1].split(' ')[0]) / 100;
            }
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                highlight(m.substring(0, 2), m.substring(2, 4));
                $('#trashTalk').text('"' + getBotCommentary() + '"');
            }
        };

        board = Chessboard('board', { 
            position: 'start', 
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
        });
        $('#board').on('click', '.square-55d63', function() { onSquareClick($(this).attr('data-square')); });
    </script>
</body>
</html>
