<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Koopa Troopa</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #fffde7; --side: #fff9c4; --text: #5f4b00; --yellow: #fbc02d; --orange: #f57f17; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 15px; }
        #board { width: 550px; border: 8px solid var(--yellow); border-radius: 12px; }
        #sidebar { flex: 1; background: var(--side); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; border: 4px solid var(--yellow); }
        #chat-window { flex: 1; background: white; border-radius: 12px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--yellow); display: flex; flex-direction: column; gap: 8px; }
        .bubble { background: #fff9c4; padding: 10px; border-radius: 15px; align-self: flex-start; border: 1px solid var(--yellow); }
        .highlight-sq { box-shadow: inset 0 0 3px 3px yellow; }
        .highlight-last { background-color: rgba(251, 192, 45, 0.4) !important; }
        button { padding: 12px; cursor: pointer; background: var(--yellow); border: none; border-radius: 10px; font-weight: bold; box-shadow: 0 3px 0 var(--orange); margin-bottom: 10px; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--orange); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <span style="font-size:2em;">🐢</span>
                <h3>King Koopa</h3>
            </div>
            <div id="chat-window">
                <div class="bubble">He he he! King Koopa Troopa is in the building!</div>
            </div>
            <button id="undoBtn">Undo Move</button>
            <button onclick="location.reload()">Rematch!</button>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, isThinking = false, chatHistory = [];
        engine.postMessage('uci'); engine.postMessage('setoption name UCI_Elo value 1400');

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        async function getAIResponse(move, isUser) {
            if (isThinking) return;
            isThinking = true;

            const inputPrompt = isUser ? `HUMAN: ${move.san}` : `KOOPA: ${move.san}`;
            chatHistory.push({
                role: 'user',
                parts: [{ text: inputPrompt }]
            });

            const bubbleId = `msg-${Date.now()}`;
            $('#chat-window').append(`<div class="bubble" id="${bubbleId}">He he he... <span style="color: #aaa;">thinking...</span></div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);

            try {
                const response = await fetch('/api/commentary-cooper', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${bubbleId}`).html("");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    $(`#${bubbleId}`).text(fullText);
                    $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
                }

                if (!fullText) {
                    $(`#${bubbleId}`).text("He he he! (No response)");
                } else {
                    chatHistory.push({
                        role: 'model',
                        parts: [{ text: fullText }]
                    });
                }

            } catch (e) {
                console.error("AI Error:", e);
                $(`#${bubbleId}`).text(`ERROR: ${e.message}`);
                chatHistory.pop();
            } finally {
                isThinking = false;
            }
        }

        async function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    await getAIResponse(move, true);
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go movetime 800');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = async function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                if (game.in_checkmate()) {
                    speak("I WON! I WON! He he he! You got Koopa'd!");
                } else {
                    await getAIResponse(move, false);
                }
            }
        };

        $('#undoBtn').click(function() {
            game.undo(); game.undo();
            board.position(game.fen());
            sourceSquare = null;
            $('.square-55d63').removeClass('highlight-sq');
            chatHistory = chatHistory.slice(0, -4);
            speak("He he he! Afraid of my genius? Fine, take it back!");
        });

        $(document).ready(function() {
            board = Chessboard('board', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
