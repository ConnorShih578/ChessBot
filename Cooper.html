<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess - Koopa Troopa</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #fffde7;
            --sidebar-color: #fff9c4;
            --text-color: #5f4b00;
            --koopa-yellow: #fbc02d;
            --koopa-orange: #f57f17;
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; display: flex;
            flex-direction: column; align-items: center; margin: 0; padding: 20px;
        }

        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; }
        #board { width: 550px; flex-shrink: 0; border: 8px solid var(--koopa-yellow); border-radius: 12px; }

        #sidebar {
            flex: 1; background-color: var(--sidebar-color); border-radius: 20px;
            padding: 20px; display: flex; flex-direction: column;
            border: 4px solid var(--koopa-yellow); box-shadow: 0 4px 0 var(--koopa-orange);
        }

        .bot-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .avatar {
            width: 60px; height: 60px; background-color: var(--koopa-yellow);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 2em; border: 3px solid var(--koopa-orange);
        }

        #chat-window {
            flex: 1; background: white; border-radius: 12px; padding: 15px;
            overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--koopa-yellow);
        }

        .bubble {
            background: #fff9c4; padding: 10px; border-radius: 15px;
            border-bottom-left-radius: 2px; align-self: flex-start;
            margin-bottom: 8px; border: 1px solid var(--koopa-yellow);
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            padding: 12px; cursor: pointer; background: var(--koopa-yellow);
            color: var(--text-color); border: none; border-radius: 10px;
            font-weight: bold; box-shadow: 0 3px 0 var(--koopa-orange);
        }

        button:active { transform: translateY(2px); box-shadow: none; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px #ffee58; }
        .highlight-last { background-color: rgba(251, 192, 45, 0.4) !important; }
    </style>
</head>
<body>

    <h1 style="color: var(--koopa-orange);">KOOPA CHESS</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div class="bot-profile">
                <div class="avatar">🐢</div>
                <div>
                    <h3 style="margin:0;">King Koopa</h3>
                    <small id="eval-bar">Evaluation: 0.0</small>
                </div>
            </div>
            <div id="chat-window">
                <div class="bubble">He he he! King Koopa Troopa is in the building!</div>
            </div>
            <div class="controls">
                <button id="undoBtn">Oops! Undo</button>
                <button onclick="location.reload()">Reset Board</button>
            </div>
        </div>
    </div>

    <!-- KOOPA SCRIPTS REMAIN UNCHANGED FROM YOUR ORIGINAL -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        /* ... Your existing Koopa logic here ... */
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, currentEval = 0.0;
        engine.postMessage('uci'); engine.postMessage('setoption name UCI_LimitStrength value true'); engine.postMessage('setoption name UCI_Elo value 1350');

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        const randomFacts = ["All hail King Koopa Troopa!", "I'm not just a shell, I'm a mastermind! He he he!", "Are you even trying? 我头痛！"];

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go movetime 1000');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                let score = parseInt(e.data.split('cp ')[1].split(' ')[0]);
                currentEval = (game.turn() === 'b' ? score : -score) / 100;
                $('#eval-bar').text('Evaluation: ' + currentEval.toFixed(1));
            }
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                speak(randomFacts[Math.floor(Math.random() * randomFacts.length)]);
            }
        };

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); board.position(game.fen());
            speak("Wait, you're taking it back? 我头痛！");
        });

        $(document).ready(function() {
            board = Chessboard('board', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
