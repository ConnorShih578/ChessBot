<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle - Bot Page</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="icon" type="image/png" href="Faviconchess.png">
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #2c2c2c;
            --text-color: #ffffff;
            --accent-green: #4CAF50;
            --accent-dark-green: #388e3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; min-height: 100vh;
        }

        .nav-link { text-decoration: none; color: var(--accent-green); font-weight: bold; margin-bottom: 10px; align-self: flex-start; }

        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 10px; }
        #board { width: 550px; flex-shrink: 0; border: 4px solid var(--accent-green); border-radius: 8px; }

        #sidebar {
            flex: 1; background-color: var(--sidebar-color); border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .bot-profile {
            display: flex; align-items: center; gap: 15px; margin-bottom: 15px;
            padding-bottom: 15px; border-bottom: 1px solid #444;
        }

        .avatar {
            width: 60px; height: 60px; background-color: var(--accent-green);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2em; color: white;
        }

        #chat-window {
            flex: 1; background: #1a1a1a; border-radius: 8px; padding: 15px;
            overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444;
        }

        .bubble {
            background: #3d3d3d; padding: 10px 14px; border-radius: 15px;
            border-bottom-left-radius: 2px; align-self: flex-start; max-width: 85%; font-size: 0.95em; line-height: 1.4;
        }

        .color-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .side-btn {
            flex: 1; padding: 10px; cursor: pointer; background: #1a1a1a; color: white;
            border: 2px solid #444; border-radius: 6px; font-weight: bold; transition: all 0.2s;
        }
        .side-btn.active {
            background: var(--accent-green); border-color: var(--accent-green); color: white;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .action-btn {
            padding: 10px; cursor: pointer; background: var(--accent-green); color: white;
            border: none; border-radius: 6px; font-weight: bold; font-size: 0.9em;
        }
        .action-btn:hover { background: var(--accent-dark-green); }

        .highlight-sq { box-shadow: inset 0 0 3px 3px var(--accent-green); }
        .highlight-last { background-color: rgba(76, 175, 80, 0.4) !important; }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">← BACK TO HOME</a>

    <div id="game-container">
        <div id="board"></div>

        <div id="sidebar">
            <div class="bot-profile">
                <div class="avatar">🐢</div>
                <div>
                    <h3 style="margin:0;">Turtle</h3>
                    <small style="color: var(--accent-green);">1200 ELO (Human)</small>
                </div>
            </div>

            <div class="color-selector">
                <button id="playWhiteBtn" class="side-btn active" onclick="setPlayerColor('w')">Play as White ♔</button>
                <button id="playBlackBtn" class="side-btn" onclick="setPlayerColor('b')">Play as Black ♚</button>
            </div>

            <div id="chat-window">
                <div class="bubble">*turtle noises* Hello! Slow and steady... pick your color when ready! *eating nois*</div>
            </div>

            <div class="controls">
                <button id="voiceToggleBtn" class="action-btn" onclick="handleVoiceToggle()">🔊 Voice</button>
                <button id="undoBtn" class="action-btn">Undo</button>
                <button onclick="resetGame()" class="action-btn">New Game</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="openingBook.js"></script>
    <script src="voice.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, isThinking = false, chatHistory = [], playerColor = 'w';

        engine.postMessage('uci'); engine.postMessage('setoption name UCI_LimitStrength value true'); engine.postMessage('setoption name UCI_Elo value 1200'); engine.postMessage('setoption name Skill Level value 5');

        function updateVoiceBtnUI() {
            $('#voiceToggleBtn').text(isVoiceMuted() ? '🔇 Muted' : '🔊 Voice');
        }

        function handleVoiceToggle() {
            toggleVoiceMute();
            updateVoiceBtnUI();
        }

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
            speakVoice(text, 'turtle');
        }

        async function getAIResponse(move, isUser) {
            if (isThinking) return;
            isThinking = true;

            const inputPrompt = isUser ? `HUMAN: ${move.san}` : `TURTLE: ${move.san}`;
            chatHistory.push({ role: 'user', parts: [{ text: inputPrompt }] });

            const bubbleId = `msg-${Date.now()}`;
            $('#chat-window').append(`<div class="bubble" id="${bubbleId}">*turtle noises...* <span style="color: #aaa;">thinking...</span></div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);

            try {
                const response = await fetch('/api/commentary-turtle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${bubbleId}`).html("");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    $(`#${bubbleId}`).text(fullText);
                    $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
                }

                if (!fullText) {
                    $(`#${bubbleId}`).text("*turtle noises* (No response)");
                } else {
                    chatHistory.push({ role: 'model', parts: [{ text: fullText }] });
                    speakVoice(fullText, 'turtle');
                }

            } catch (e) {
                console.error("AI Error:", e);
                $(`#${bubbleId}`).text(`ERROR: ${e.message}`);
                chatHistory.pop();
            } finally {
                isThinking = false;
            }
        }

        async function makeBotMove() {
            if (game.game_over()) return;

            const bookMove = window.getOpeningBookMove ? window.getOpeningBookMove(game, 'turtle') : null;
            if (bookMove) {
                const botMove = game.move(bookMove);
                if (botMove) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+botMove.from+', .square-'+botMove.to).addClass('highlight-last');
                    await getAIResponse(botMove, false);
                    sourceSquare = null;
                    return;
                }
            }

            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go movetime 800');
        }

        async function setPlayerColor(color) {
            playerColor = color;
            resetGame();
        }

        async function resetGame() {
            game.reset();
            chatHistory = [];
            board.position('start');
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            $('.square-55d63').removeClass('highlight-last highlight-sq');
            sourceSquare = null;

            $('#playWhiteBtn').toggleClass('active', playerColor === 'w');
            $('#playBlackBtn').toggleClass('active', playerColor === 'b');
            
            const intro = '*turtle noises* Playing as ' + (playerColor === 'w' ? 'White' : 'Black') + '! *eating nois*';
            $('#chat-window').html('<div class="bubble">' + intro + '</div>');
            speakVoice(intro, 'turtle');

            if (playerColor === 'b') {
                await makeBotMove();
            }
        }

        async function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over() || isThinking) return;

            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === playerColor && game.turn() === playerColor) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    await getAIResponse(move, true);
                    if (!game.game_over()) {
                        await makeBotMove();
                    }
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = async function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                await getAIResponse(move, false);
            }
        };

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); 
            board.position(game.fen());
            $('.square-55d63').removeClass('highlight-last');
            $('.square-55d63').removeClass('highlight-sq');
            sourceSquare = null;
            chatHistory = chatHistory.slice(0, -4);
            speak("*turtle noises* Take your move back! *eating nois*");
        });

        $(document).ready(function() {
            updateVoiceBtnUI();
            board = Chessboard('board', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
