<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle - Bot Page</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="chessStyles.css">
    <link rel="icon" type="image/png" href="Faviconchess.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #212121;
            --sidebar-color: #2c2c2c;
            --text-color: #ffffff;
            --accent-green: #4CAF50;
            --accent-dark-green: #388E3C;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 16px 12px;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
        }

        .nav-link {
            text-decoration: none;
            color: var(--accent-green);
            font-weight: bold;
            margin-bottom: 12px;
            align-self: center;
            width: 100%;
            max-width: 1050px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            opacity: 0.85;
        }

        #game-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1050px;
            min-height: 600px;
            margin-top: 4px;
        }

        #board {
            width: 550px;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            border: 4px solid var(--accent-green);
            border-radius: 8px;
            touch-action: manipulation;
            position: relative;
        }

        #sidebar {
            flex: 1;
            background-color: var(--sidebar-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 0;
        }

        .bot-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #444;
        }

        .avatar {
            width: 55px;
            height: 55px;
            flex-shrink: 0;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            color: white;
            transition: transform 0.2s;
        }

        #chat-window {
            flex: 1;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #444;
            min-height: 170px;
            -webkit-overflow-scrolling: touch;
        }

        .bubble {
            background: #3d3d3d;
            padding: 10px 14px;
            border-radius: 15px;
            border-bottom-left-radius: 2px;
            align-self: flex-start;
            max-width: 88%;
            font-size: 0.92em;
            line-height: 1.4;
            word-break: break-word;
        }

        .color-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        .side-btn {
            flex: 1;
            padding: 10px 6px;
            cursor: pointer;
            background: #1a1a1a;
            color: white;
            border: 2px solid #444;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-align: center;
        }

        .side-btn.active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .action-btn {
            padding: 10px 4px;
            cursor: pointer;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.82rem;
            text-align: center;
            transition: background-color 0.2s;
            min-height: 40px;
        }

        .action-btn:hover {
            background: var(--accent-dark-green);
        }

        .highlight-sq {
            box-shadow: inset 0 0 3px 3px var(--accent-green);
        }

        .highlight-last {
            background-color: rgba(76, 175, 80, 0.4) !important;
        }

        @media (max-width: 850px) {
            body {
                padding: 12px 10px 24px 10px;
            }

            .nav-link {
                margin-bottom: 8px;
            }

            #game-container {
                flex-direction: column;
                height: auto;
                align-items: center;
                gap: 14px;
            }

            #board {
                width: 100%;
                max-width: 480px;
            }

            #sidebar {
                width: 100%;
                max-width: 480px;
                padding: 14px;
            }

            .bot-profile {
                margin-bottom: 10px;
                padding-bottom: 10px;
                gap: 12px;
            }

            .avatar {
                width: 48px;
                height: 48px;
                font-size: 1.6em;
            }

            #chat-window {
                height: 160px;
                min-height: 130px;
                max-height: 200px;
                flex: none;
                padding: 12px;
            }

            .side-btn {
                padding: 9px 4px;
                font-size: 0.82rem;
            }

            .action-btn {
                padding: 9px 2px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">← BACK TO HOME</a>

    <div id="game-container">
        <div class="board-area-wrapper">
            <div class="eval-bar-container" title="Evaluation Bar">
                <div id="eval-bar-fill" class="eval-bar-fill"></div>
                <div id="eval-bar-text" class="eval-bar-text">0.0</div>
            </div>
            <div class="board-section">
                <div class="captured-row">
                    <div id="topCaptured" class="cap-pieces-list"></div>
                    <div id="topPlayerLabel" style="font-size: 0.8rem; color: #888;">Turtle</div>
                </div>
                <div id="board"></div>
                <div class="captured-row">
                    <div id="bottomCaptured" class="cap-pieces-list"></div>
                    <div id="bottomPlayerLabel" style="font-size: 0.8rem; color: #888;">You</div>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <div class="bot-profile">
                <div class="avatar">🐢</div>
                <div>
                    <h3 style="margin:0;">Turtle</h3>
                    <small style="color: var(--accent-green);">1200 ELO (Human)</small>
                </div>
            </div>

            <div class="color-selector">
                <button id="playWhiteBtn" class="side-btn active">Play as White ♔</button>
                <button id="playBlackBtn" class="side-btn">Play as Black ♚</button>
            </div>

            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px; font-weight: bold;">MOVE LOG:</div>
            <div id="move-history" class="move-history-container" title="Move History"></div>

            <div id="chat-window">
                <div class="bubble">*turtle noises* Hello! Slow and steady... pick your color when ready! *eating nois*</div>
            </div>

            <form id="chat-form" class="chat-input-form" onsubmit="event.preventDefault(); window.sendUserChatMessage();">
                <input type="text" id="userChatInput" placeholder="Chat with Turtle..." autocomplete="off" maxlength="140">
                <button type="submit" class="chat-send-btn">Send ↵</button>
            </form>

            <div class="controls">
                <button id="voiceToggleBtn" class="action-btn">🔊 VOICE</button>
                <button id="undoBtn" class="action-btn">UNDO</button>
                <button id="resetBtn" class="action-btn">NEW GAME</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="openingBook.js"></script>
    <script src="chessAudio.js"></script>
    <script src="voice.js"></script>

    <script type="module">
        import { playMoveSound, playCaptureSound, playCheckSound, playGameOverSound, playBotSound } from './chessAudio.js';
        import { showLegalMoveDots, clearLegalMoveDots, updateCapturedPieces, updateMoveHistoryUI, updateEvalBarUI, updateBotReactionUI, promptPawnPromotion } from './chessUI.js';

        const BOT_KEY = 'turtle';
        const MAX_CHAT_MESSAGES = 12;
        const MAX_CHAT_TEXT_LEN = 250;
        const game = new Chess();
        let board = null;
        let isThinking = false;
        let chatHistory = [];
        let playerColor = 'w';
        let sourceSquare = null;

        const engine = new Worker('./stockfish-18-lite-single.js');
        engine.postMessage('uci');
        engine.postMessage('setoption name UCI_LimitStrength value true');
        engine.postMessage('setoption name UCI_Elo value 1200');
        engine.postMessage('setoption name Skill Level value 5');

        function updateVoiceBtnUI() {
            $('#voiceToggleBtn').text(isVoiceMuted() ? '🔇 MUTED' : '🔊 VOICE');
        }

        $('#voiceToggleBtn').click(() => {
            toggleVoiceMute();
            updateVoiceBtnUI();
        });

        function refreshBoardUI() {
            const isPlayerWhite = playerColor === 'w';
            updateCapturedPieces(game, {
                whiteContainer: isPlayerWhite ? document.getElementById('bottomCaptured') : document.getElementById('topCaptured'),
                blackContainer: isPlayerWhite ? document.getElementById('topCaptured') : document.getElementById('bottomCaptured')
            });

            $('#topPlayerLabel').text(isPlayerWhite ? 'Turtle (Black)' : 'Turtle (White)');
            $('#bottomPlayerLabel').text(isPlayerWhite ? 'You (White)' : 'You (Black)');

            updateMoveHistoryUI(game, document.getElementById('move-history'));
        }

        function updateHighlight(move) {
            $('.square-55d63').removeClass('highlight-last');
            if (move) {
                $('.square-' + move.from + ', .square-' + move.to).addClass('highlight-last');
            }
        }

        function addMessage(text, id = null, isUser = false) {
            const idAttr = id ? `id="${id}"` : '';
            const userClass = isUser ? 'user-bubble' : '';
            const displayText = (text && text.length > MAX_CHAT_TEXT_LEN) ? text.slice(0, MAX_CHAT_TEXT_LEN) + '...' : text;
            $('#chat-window').append(`<div class="bubble ${userClass}" ${idAttr}>${displayText}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
            if (!isUser) speakVoice(displayText, BOT_KEY);
        }

        window.sendUserChatMessage = async function() {
            const input = document.getElementById('userChatInput');
            if (!input) return;
            const rawText = input.value.trim();
            if (!rawText || isThinking) return;
            const text = rawText.slice(0, MAX_CHAT_TEXT_LEN);

            input.value = '';
            addMessage(text, null, true);

            chatHistory.push({ role: 'user', parts: [{ text: `HUMAN_CHAT: ${text}` }] });
            const msgId = `msg-${Date.now()}`;
            addMessage("*turtle noises...*", msgId, false);

            try {
                const res = await fetch('/api/commentary-turtle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${msgId}`).html("");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    const clean = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    const displayClean = clean.length > MAX_CHAT_TEXT_LEN ? clean.slice(0, MAX_CHAT_TEXT_LEN) + '...' : clean;
                    $(`#${msgId}`).text(displayClean);
                    $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
                }

                if (fullText) {
                    const cleanText = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    const displayClean = cleanText.length > MAX_CHAT_TEXT_LEN ? cleanText.slice(0, MAX_CHAT_TEXT_LEN) + '...' : cleanText;
                    chatHistory.push({ role: 'model', parts: [{ text: displayClean }] });
                    speakVoice(displayClean, BOT_KEY);
                }
            } catch (err) {
                console.error(err);
                $(`#${msgId}`).text(`ERROR: ${err.message}`);
                chatHistory.pop();
            }
        };

        async function handleGameOver() {
            let resultMsg = "";
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Black' : 'White';
                resultMsg = `*turtle noises* Checkmate! ${winner} wins!`;
            } else if (game.in_draw()) {
                resultMsg = "*turtle noises* Draw / stalemate!";
            }
            addMessage(resultMsg);
        }

        async function getAIResponse(move, isUser) {
            if (isThinking) return;
            isThinking = true;

            const inputPrompt = isUser ? `HUMAN: ${move.san}` : `TURTLE: ${move.san}`;
            chatHistory.push({ role: 'user', parts: [{ text: inputPrompt }] });

            const bubbleId = `msg-${Date.now()}`;
            addMessage("*turtle noises...*", bubbleId, false);

            try {
                const response = await fetch('/api/commentary-turtle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${bubbleId}`).html("");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    const clean = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    const displayClean = clean.length > MAX_CHAT_TEXT_LEN ? clean.slice(0, MAX_CHAT_TEXT_LEN) + '...' : clean;
                    $(`#${bubbleId}`).text(displayClean);
                    $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
                }

                if (fullText) {
                    const cleanText = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    const displayClean = cleanText.length > MAX_CHAT_TEXT_LEN ? cleanText.slice(0, MAX_CHAT_TEXT_LEN) + '...' : cleanText;
                    chatHistory.push({ role: 'model', parts: [{ text: displayClean }] });
                    speakVoice(displayClean, BOT_KEY);
                }
            } catch (e) {
                console.error("AI Error:", e);
                $(`#${bubbleId}`).text(`ERROR: ${e.message}`);
                chatHistory.pop();
            } finally {
                isThinking = false;
            }
        }

        async function makeBotMove() {
            if (game.game_over()) return;

            const bookMove = window.getOpeningBookMove ? window.getOpeningBookMove(game, BOT_KEY) : null;
            if (bookMove) {
                const botMove = game.move(bookMove);
                if (botMove) {
                    board.position(game.fen());
                    updateHighlight(botMove);

                    if (botMove.captured) {
                        playCaptureSound();
                        playBotSound(BOT_KEY);
                    } else {
                        playMoveSound();
                    }

                    if (game.in_check()) playCheckSound();

                    refreshBoardUI();

                    if (game.game_over()) {
                        playGameOverSound(game.turn() !== playerColor);
                        handleGameOver();
                    }

                    await getAIResponse(botMove, false);
                    sourceSquare = null;
                    return;
                }
            }

            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go movetime 700');
        }

        async function resetGame() {
            game.reset();
            chatHistory = [];
            board.position('start');
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            $('.square-55d63').removeClass('highlight-last highlight-sq');
            clearLegalMoveDots();
            sourceSquare = null;

            $('#playWhiteBtn').toggleClass('active', playerColor === 'w');
            $('#playBlackBtn').toggleClass('active', playerColor === 'b');

            updateEvalBarUI(0, false, playerColor);
            updateBotReactionUI(BOT_KEY, 0, false, false);
            refreshBoardUI();

            const intro = '*turtle noises* Hello! Slow and steady... playing as ' + (playerColor === 'w' ? 'White' : 'Black') + '.';
            $('#chat-window').html('<div class="bubble">' + intro + '</div>');
            speakVoice(intro, BOT_KEY);

            if (playerColor === 'b') {
                await makeBotMove();
            }
        }

        $('#playWhiteBtn').click(() => { playerColor = 'w'; resetGame(); });
        $('#playBlackBtn').click(() => { playerColor = 'b'; resetGame(); });
        $('#resetBtn').click(() => resetGame());

        function executePlayerMove(from, to, promotion = 'q') {
            const move = game.move({ from, to, promotion });
            $('.square-55d63').removeClass('highlight-sq');
            clearLegalMoveDots();

            if (move) {
                board.position(game.fen());
                updateHighlight(move);

                if (move.captured) {
                    playCaptureSound();
                } else {
                    playMoveSound();
                }

                if (game.in_check()) playCheckSound();

                refreshBoardUI();

                if (game.game_over()) {
                    playGameOverSound(!game.in_checkmate() || game.turn() !== playerColor);
                    handleGameOver();
                } else {
                    getAIResponse(move, true).then(() => {
                        if (!game.game_over()) {
                            makeBotMove();
                        }
                    });
                }
            }
            sourceSquare = null;
        }

        async function onSquareClick() {
            const square = $(this).attr('data-square');
            if (game.game_over() || isThinking) return;

            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === playerColor && game.turn() === playerColor) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                    showLegalMoveDots(game, square);
                }
            } else {
                if (square === sourceSquare) {
                    sourceSquare = null;
                    $('.square-55d63').removeClass('highlight-sq');
                    clearLegalMoveDots();
                    return;
                }

                const piece = game.get(sourceSquare);
                const isPromo = piece && piece.type === 'p' && ((piece.color === 'w' && square[1] === '8') || (piece.color === 'b' && square[1] === '1'));

                const legalMoves = game.moves({ square: sourceSquare, verbose: true });
                const isLegal = legalMoves.some(m => m.to === square);

                if (isLegal) {
                    if (isPromo) {
                        promptPawnPromotion(playerColor, (chosenPiece) => {
                            executePlayerMove(sourceSquare, square, chosenPiece);
                        });
                    } else {
                        executePlayerMove(sourceSquare, square, 'q');
                    }
                } else {
                    const clickedPiece = game.get(square);
                    if (clickedPiece && clickedPiece.color === playerColor) {
                        sourceSquare = square;
                        $('.square-55d63').removeClass('highlight-sq');
                        $('.square-' + square).addClass('highlight-sq');
                        showLegalMoveDots(game, square);
                    } else {
                        sourceSquare = null;
                        $('.square-55d63').removeClass('highlight-sq');
                        clearLegalMoveDots();
                    }
                }
            }
        }

        engine.onmessage = async function(e) {
            if (typeof e.data === 'string') {
                if (e.data.startsWith('info') && e.data.includes('score')) {
                    const cpMatch = e.data.match(/score cp (-?\d+)/);
                    const mateMatch = e.data.match(/score mate (-?\d+)/);
                    if (cpMatch) {
                        let cp = parseInt(cpMatch[1], 10) / 100;
                        if (game.turn() === 'b') cp = -cp;
                        updateEvalBarUI(cp, false, playerColor);
                        updateBotReactionUI(BOT_KEY, cp, game.in_check(), game.game_over());
                    } else if (mateMatch) {
                        let mate = parseInt(mateMatch[1], 10);
                        if (game.turn() === 'b') mate = -mate;
                        updateEvalBarUI(mate, true, playerColor);
                        updateBotReactionUI(BOT_KEY, mate > 0 ? 10 : -10, game.in_check(), game.game_over());
                    }
                }

                if (e.data.startsWith('bestmove')) {
                    const m = e.data.split(' ')[1];
                    if (!m || m === '(none)') return;

                    const move = game.move({
                        from: m.substring(0, 2),
                        to: m.substring(2, 4),
                        promotion: m.length > 4 ? m[4] : 'q'
                    });

                    if (move) {
                        board.position(game.fen());
                        updateHighlight(move);

                        if (move.captured) {
                            playCaptureSound();
                            playBotSound(BOT_KEY);
                        } else {
                            playMoveSound();
                        }

                        if (game.in_check()) playCheckSound();

                        refreshBoardUI();

                        if (game.game_over()) {
                            playGameOverSound(game.turn() !== playerColor);
                            handleGameOver();
                        }

                        await getAIResponse(move, false);
                    }
                }
            }
        };

        $('#undoBtn').on('click', function() {
            game.undo();
            game.undo();
            board.position(game.fen());
            clearLegalMoveDots();
            $('.square-55d63').removeClass('highlight-last highlight-sq');
            sourceSquare = null;
            chatHistory = chatHistory.slice(0, -4);
            refreshBoardUI();
            addMessage("*turtle noises* Undo move!");
        });

        $(document).ready(function() {
            updateVoiceBtnUI();
            board = Chessboard('board', { 
                position: 'start', draggable: false, 
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
            });
            $(document).on('click', '.square-55d63', onSquareClick);
            $(window).on('resize', function() {
                if (board) board.resize();
            });
            refreshBoardUI();
        });
    </script>
</body>
</html>
