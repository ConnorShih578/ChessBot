<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Chess - Play Gween Turtle</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #2c2c2c;
            --text-color: #ffffff;
            --turtle-green: #4CAF50;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
        }

        #game-container {
            display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px;
        }

        #board { width: 550px; flex-shrink: 0; border: 5px solid #444; border-radius: 4px; }

        #sidebar {
            flex: 1; background-color: var(--sidebar-color); border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .bot-profile {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid #444;
        }

        .avatar {
            width: 60px; height: 60px; background-color: var(--turtle-green);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 2em;
        }

        #chat-window {
            flex: 1; background: #1a1a1a; border-radius: 8px; padding: 15px;
            overflow-y: auto; margin-bottom: 15px; display: flex;
            flex-direction: column; gap: 10px;
        }

        .bubble {
            background: #3d3d3d; padding: 10px 14px; border-radius: 15px;
            border-bottom-left-radius: 2px; align-self: flex-start;
            max-width: 85%; font-size: 0.95em; line-height: 1.4;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        button {
            padding: 12px; cursor: pointer; background: #444; color: white;
            border: none; border-radius: 6px; font-weight: bold;
        }

        button:hover { background: #555; }
        .primary-btn { background: var(--turtle-green); }

        .highlight-sq { box-shadow: inset 0 0 3px 3px #4CAF50; }
        .highlight-last { background-color: rgba(76, 175, 80, 0.4) !important; }
    </style>
</head>
<body>

    <h1 style="color: var(--turtle-green);">Tim Chess</h1>

    <div id="game-container">
        <div id="board"></div>

        <div id="sidebar">
            <div class="bot-profile">
                <div class="avatar">🐢</div>
                <div>
                    <h3 style="margin:0;">Gween Turtle</h3>
                    <small style="color: #aaa;">Status: Slow but steady</small>
                </div>
            </div>

            <div id="chat-window">
                <div class="bubble">Hi, I’m Gween Turtle</div>
            </div>

            <div class="controls">
                <button id="undoBtn">Undo Move</button>
                <button class="primary-btn" onclick="location.reload()">New Game</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, 
            game = new Chess(), 
            engine = new Worker('./stockfish-18-lite-single.js'), 
            sourceSquare = null,
            currentEval = 0;

        engine.postMessage('uci');
        engine.postMessage('setoption name UCI_LimitStrength value true');
        engine.postMessage('setoption name UCI_Elo value 1350');
        engine.postMessage('setoption name Contempt value 100'); 
        engine.postMessage('setoption name Threads value 1');

        const pools = {
            winning: ["You Will Suffer From Turtle", "我是更好", "eating nois", "Slow... but very steady. eating nois", "They say slow and steady wins the race, ask my friend Gween Fwog, he knows."],
            losing: ["*turtle noises* (nervous)", "I have pwentty of time... I think.", "Do you like my gween shell?", "eating nois (slowly)", "I wonder why my shell looks different...", "Oh, no! My shell is cracking!"],
            neutral: ["Hi, I’m Gween Turtle", "*turtle noises*", "eating nois", "Do you like my gween shell?", "I look better than King Koopa, right? My shell is more GWEEN."],
            gameWin: ["You suffered from Turtle! eating nois (happy)", "My shell is too strong! 我是更好!", "Turtle wins the race! *happy turtle noises*"],
            gameLoss: ["My shell... it's in pieces. *sad turtle noises*", "I ran out of time? But turtles live forever...", "I will go back in my shell now. eating nois (sad)"],
            gameDraw: ["We are both turtles today. *turtle noises*", "A draw? eating nois (confused)", "My shell and your shell are the same."]
        };

        function speak(text) {
            const chat = document.getElementById('chat-window');
            $('#chat-window').append(`<div class="bubble">${text}</div>`);
            chat.scrollTop = chat.scrollHeight;
        }

        function getCommentary() {
            let pool = pools.neutral;
            if (currentEval > 0.7) pool = pools.winning;
            else if (currentEval < -0.7) pool = pools.losing;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function checkGameOver() {
            if (game.game_over()) {
                if (game.in_checkmate()) {
                    if (game.turn() === 'b') {
                        speak(pools.gameLoss[Math.floor(Math.random() * pools.gameLoss.length)]);
                    } else {
                        speak(pools.gameWin[Math.floor(Math.random() * pools.gameWin.length)]);
                    }
                } else {
                    speak(pools.gameDraw[Math.floor(Math.random() * pools.gameDraw.length)]);
                }
                return true;
            }
            return false;
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;

            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    
                    if (!checkGameOver()) {
                        engine.postMessage('position fen ' + game.fen());
                        engine.postMessage('go movetime 1000'); 
                    }
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score ')) {
                const scoreParts = e.data.split('score ')[1].split(' ');
                const scoreType = scoreParts[0]; 
                const scoreValue = parseInt(scoreParts[1]);

                if (scoreType === 'cp') {
                    currentEval = scoreValue / 100;
                } else if (scoreType === 'mate') {
                    currentEval = scoreValue > 0 ? 99 : -99;
                }
            }

            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                
                if (!checkGameOver()) {
                    speak(getCommentary());
                }
            }
        };

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); 
            board.position(game.fen());
            $('.square-55d63').removeClass('highlight-last');
            $('.square-55d63').removeClass('highlight-sq');
            sourceSquare = null;
            speak("I have pwentty of time... take it back.");
        });

        $(document).ready(function() {
            board = Chessboard('board', { 
                position: 'start', draggable: false, 
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
            });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
