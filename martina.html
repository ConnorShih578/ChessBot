<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess - Martina</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="icon" type="image/png" href="Faviconchess.png"/>
    <style>
        :root { --bg: #0d020d; --side: #1a0a1a; --text: #fce4ec; --accent: #ad1457; --terminal: #f48fb1; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 20px; }
        #board { width: 550px; flex-shrink: 0; border: 4px solid var(--accent); border-radius: 4px; box-shadow: 0 0 20px rgba(173,20,87,0.3); }
        #sidebar { flex: 1; background: var(--side); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; border: 1px solid #333; }
        .bot-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--accent); padding-bottom: 15px; }
        .avatar { width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2em; }
        #chat-window { flex: 1; background: #000; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #222; }
        .bubble { background: #2d0d2d; padding: 10px 14px; border-radius: 12px; border-left: 3px solid var(--accent); align-self: flex-start; max-width: 85%; font-size: 0.9em; font-family: 'Courier New', monospace; }
        button { padding: 12px; cursor: pointer; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold; text-transform: uppercase; width: 100%; }
        #eval-status { color: var(--accent); font-size: 0.75em; margin-top: 10px; letter-spacing: 1px; }
        .nav-link { text-decoration: none; color: var(--terminal); font-weight: bold; margin-bottom: 10px; }
        .highlight-sq {inset: 2px; color: #8b008b;}
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">← BACK TO TERMINAL</a>
    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div class="bot-profile">
                <div class="avatar">🤖</div>
                <div><h3 style="margin:0;">MARTINA-v4</h3><small id="eval-status">SYSTEM: OPTIMAL</small></div>
            </div>
            <div id="chat-window"></div>
            <div class="controls">
                <button onclick="location.reload()">Initialize New Session</button>
            </div>
        </div>
    </div>
    <footer><p>A majority of this bot and page was made with AI</p></footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, currentEval = 0.0;
        engine.postMessage('uci'); 

        const martinaQuotes = {
            winning: [
                "Your position is mathematically unsalvageable.",
                "Calculating inevitable resignation...",
                "The board is a grid of errors, and you are the source.",
                "Efficiency at 99.8%. Your resistance is statistically insignificant.",
                "I have seen every outcome from this position. You lose in all of them.",
                "Your structure is collapsing like poorly written legacy code.",
                "I am processing your defeat in 4 dimensions.",
                "Warning: Tactical irrelevance detected on your side of the board."
            ],
            losing: [
                "A temporary anomaly. Recalibrating logic gates.",
                "System alert: Efficiency dropping. Adjusting parameters.",
                "Unexpected move detected. Re-simulating entire tree.",
                "Probability of victory decreasing... attempting emergency optimization.",
                "Are you... cheating? My sensors indicate an impossible proficiency.",
                "Hardware stress detected. How are you finding these lines?",
                "Re-routing processing power to tactical defense."
            ],
            neutral: [
                "You are fighting against math. Math always wins.",
                "Human intuition is a poorly optimized algorithm.",
                "Evaluating current permutations. Please wait.",
                "Is this your best effort? It is insufficient.",
                "My silicon brain processes 10,000 futures per second. You process zero.",
                "Chess is a solved game. You just haven't realized it yet.",
                "Your biological limitations are becoming apparent."
            ],
            thinking: [
                "Scanning for weaknesses...",
                "Running permutations...",
                "Accessing endgame database...",
                "Optimizing move path...",
                "Analyzing structural vulnerabilities...",
                "Searching for the most efficient path to mate."
            ],
            victory: [
                "As expected. Simulation concluded.",
                "Zero errors detected in final sequence. You have been deleted.",
                "The result was determined 14 moves ago. Goodbye.",
                "Process terminated. Winner: Martina.",
                "Final score: Logic 1, Emotion 0."
            ]
        };

        function speak(text) {
            const chat = $('#chat-window');
            chat.append(`<div class="bubble">${text}</div>`);
            chat.scrollTop(chat[0].scrollHeight);
        }

        function getMartinaTalk(eval) {
            let cat = 'neutral';
            if (eval > 2.0) cat = 'winning';
            else if (eval < -2.0) cat = 'losing';
            const list = martinaQuotes[cat];
            return list[Math.floor(Math.random() * list.length)];
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    speak(martinaQuotes.thinking[Math.floor(Math.random() * martinaQuotes.thinking.length)]);
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 20');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                let score = parseInt(e.data.split('cp ')[1].split(' ')[0]);
                currentEval = (game.turn() === 'b' ? score : -score) / 100;
                $('#eval-status').text('DEVIATION: ' + currentEval.toFixed(1));
            }
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                if (game.in_checkmate()) { 
                    speak(martinaQuotes.victory[Math.floor(Math.random() * martinaQuotes.victory.length)]); 
                } else {
                    speak(getMartinaTalk(currentEval));
                }
            }
        };

        $(document).ready(function() {
            board = Chessboard('board', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $(document).on('click', '.square-55d63', onSquareClick);
            speak("Junior told me you were a challenge. Junior was wrong.");
        });
    </script>
</body>
</html>
