<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess Experimental Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg: #0d0d0d;
            --sidebar: #1a1a1a;
            --text: #00ff41;
            --accent: #008f11;
            --terminal: #003b00;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; 
        }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 20px; }
        #board { width: 500px; flex-shrink: 0; border: 2px solid var(--accent); box-shadow: 0 0 20px var(--terminal); }
        #sidebar { 
            flex: 1; background: var(--sidebar); border-radius: 4px; 
            padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--accent);
        }
        #chat-window { 
            flex: 1; background: #000; border-radius: 4px; padding: 15px; 
            overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--terminal);
            font-size: 0.85em; color: var(--text);
        }
        .bubble { margin-bottom: 12px; border-left: 2px solid var(--accent); padding-left: 10px; line-height: 1.4; }
        #status-bar { font-size: 0.7em; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        button { 
            padding: 12px; cursor: pointer; background: var(--terminal); 
            color: var(--text); border: 1px solid var(--accent); font-weight: bold; font-family: inherit;
        }
        button:hover { background: var(--accent); color: #000; }
        footer { margin-top: 30px; color: #333; font-size: 0.7em; }
    </style>
</head>
<body>

    <h1 style="letter-spacing: 5px;">TIM_CHESS_EXPERIMENTAL_BOT_v1.2</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status-bar">SYSTEM: WAKING UP...</div>
            <div id="chat-window">
                <div class="bubble">> AWAKENING... NEURAL LINK STABLE.</div>
            </div>
            <button onclick="location.reload()">REBOOT SYSTEM</button>
        </div>
    </div>

    <footer>Powered by WebLLM, Stockfish 18, and QianWen AI.</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        var board = null;
        var game = new Chess();
        var llm = null;
        
        // --- STOCKFISH SETUP ---
        var engine = new Worker('https://cdn.jsdelivr.net/npm/stockfish/src/stockfish.js');
        engine.postMessage('uci');
        engine.postMessage('setoption name UCI_LimitStrength value true');
        engine.postMessage('setoption name UCI_Elo value 1500'); 
        engine.postMessage('ucinewgame');
        engine.postMessage('isready');

        async function initAI() {
            const modelId = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
            try {
                llm = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (p) => {
                        $('#status-bar').text(`LOADING NEURAL NETWORK: ${Math.round(p.progress * 100)}%`);
                    }
                });
                $('#status-bar').text("SYSTEM: READY TO PLAY");
                
                const greeting = await llm.chat.completions.create({
                    messages: [
                        { role: "system", content: "Your name is Tim Chess Experimental Bot. You're a friendly, enthusiastic, and helpful chess buddy. You love a good game!" },
                        { role: "user", content: "Hey! Introduce yourself and tell me you're ready to play." }
                    ]
                });
                speak(greeting.choices[0].message.content);
            } catch (e) {
                $('#status-bar').text("SYSTEM: CONNECTION ERROR");
            }
        }

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">> ${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        async function getAICommentary(moveSan, isPlayer) {
            if (!llm) return;

            let context = isPlayer ? "The player just made a move." : "I just made a move.";
            if (game.in_check()) context += " Also, someone is in check!";
            if (game.history().length < 6) context += " We're still in the early opening phase.";

            const response = await llm.chat.completions.create({
                messages: [
                    { 
                        role: "system", 
                        content: "You are the Tim Chess Experimental Bot. You're friendly, a bit witty, and love watching the game unfold. React to the latest move naturally. Don't be too technical—be a friend! Avoid calling out checkmate unless the game is actually over." 
                    },
                    { 
                        role: "user", 
                        content: `${context} The move was ${moveSan}. Current FEN: ${game.fen()}` 
                    }
                ]
            });
            speak(response.choices[0].message.content);
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            $('#status-bar').text("SYSTEM: THINKING...");
            board.position(game.fen());
            
            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go depth 10'); 
            
            getAICommentary(move.san, true);
        }

        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var moveStr = e.data.split(' ')[1];
                if (moveStr && moveStr !== '(none)') {
                    const engineMove = game.move({ 
                        from: moveStr.substring(0, 2), 
                        to: moveStr.substring(2, 4), 
                        promotion: 'q' 
                    });
                    
                    if (engineMove) {
                        board.position(game.fen());
                        $('#status-bar').text("SYSTEM: YOUR TURN!");
                        getAICommentary(engineMove.san, false);
                    }
                }
            }
        };

        $(document).ready(function() {
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                onSnapEnd: function() { board.position(game.fen()); },
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            initAI();
        });
    </script>
</body>
</html>
