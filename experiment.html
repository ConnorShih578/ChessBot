<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess - Experimental Bot</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg: #0d0d0d;
            --sidebar: #1a1a1a;
            --text: #00ff41;
            --accent: #008f11;
            --terminal: #003b00;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; 
        }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 20px; }
        /* Fixed board width to prevent invisibility */
        #board { width: 500px; flex-shrink: 0; border: 2px solid var(--accent); box-shadow: 0 0 20px var(--terminal); }
        #sidebar { 
            flex: 1; background: var(--sidebar); border-radius: 4px; 
            padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--accent);
        }
        #chat-window { 
            flex: 1; background: #000; border-radius: 4px; padding: 15px; 
            overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--terminal);
            font-size: 0.85em; color: var(--text);
        }
        .bubble { margin-bottom: 12px; border-left: 2px solid var(--accent); padding-left: 10px; line-height: 1.4; }
        #status-bar { font-size: 0.7em; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        button { 
            padding: 12px; cursor: pointer; background: var(--terminal); 
            color: var(--text); border: 1px solid var(--accent); font-weight: bold; font-family: inherit;
        }
        button:hover { background: var(--accent); color: #000; }
        footer { margin-top: 30px; color: #333; font-size: 0.7em; }
    </style>
</head>
<body>

    <h1 style="letter-spacing: 5px;">EXPERIMENTAL_BOT_v1.2</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status-bar">SYSTEM: INITIALIZING...</div>
            <div id="chat-window">
                <div class="bubble">> CONNECTION ESTABLISHED. AWAITING NEURAL LINK...</div>
            </div>
            <button onclick="location.reload()">REBOOT SYSTEM</button>
        </div>
    </div>

    <footer>This bot and page was made with AI. Powered by WebLLM & Stockfish 18.</footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        var board = null;
        var game = new Chess();
        var llm = null;
        
        // Stockfish Worker Setup
        var engine = new Worker('https://cdn.jsdelivr.net/npm/stockfish/src/stockfish.js');
        engine.postMessage('uci');
        engine.postMessage('isready');

        async function initAI() {
            const modelId = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
            try {
                llm = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (p) => {
                        $('#status-bar').text(`AI DOWNLOAD: ${Math.round(p.progress * 100)}%`);
                    }
                });
                
                $('#status-bar').text("SYSTEM: ONLINE");
                
                // Greeting
                const greeting = await llm.chat.completions.create({
                    messages: [
                        { role: "system", content: "You are a cold, calculated chess bot. You speak in short, professional, yet slightly condescending sentences." },
                        { role: "user", content: "Initiate conversation with the human player." }
                    ]
                });
                speak(greeting.choices[0].message.content);
                
            } catch (e) {
                $('#status-bar').text("SYSTEM: GPU ERROR");
                console.error(e);
            }
        }

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">> ${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        async function getAICommentary(move) {
            if (!llm) return;
            const response = await llm.chat.completions.create({
                messages: [
                    { role: "system", content: "You are a witty chess bot. Analyze the move and give a 1-sentence reaction based on the FEN." },
                    { role: "user", content: `The player moved ${move}. Board state: ${game.fen()}` }
                ]
            });
            speak(response.choices[0].message.content);
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            
            // If illegal move, snap back
            if (move === null) return 'snapback';

            $('#status-bar').text("SYSTEM: PROCESSING...");
            
            // Send move to Stockfish
            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go depth 12');
            
            getAICommentary(move.san);
        }

        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var moveStr = e.data.split(' ')[1];
                game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('#status-bar').text("SYSTEM: AWAITING INPUT");
            }
        };

        $(document).ready(function() {
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                onSnapEnd: function() { board.position(game.fen()); },
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            initAI();
        });
    </script>
</body>
</html>
