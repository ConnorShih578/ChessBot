<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Chess - Polite Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="chessStyles.css">
    <link rel="icon" type="image/png" href="Faviconchess.png">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --text-main: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 14px;
            overflow-x: hidden;
            width: 100%;
        }

        h1 {
            margin: 0 0 16px 0;
            color: var(--accent-blue);
            font-size: clamp(1.4rem, 4vw, 2rem);
            text-align: center;
        }

        #game-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1050px;
            min-height: 600px;
            margin-top: 5px;
        }

        #board {
            width: 550px;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            border: 2px solid #333;
            border-radius: 4px;
            touch-action: manipulation;
            position: relative;
        }

        #sidebar {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 4px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            min-width: 0;
        }

        #status {
            font-weight: bold;
            color: var(--accent-green);
            margin-bottom: 10px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        #chat-window {
            flex: 1;
            background: #000;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #222;
            min-height: 180px;
            -webkit-overflow-scrolling: touch;
        }

        .bubble {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-green);
            align-self: flex-start;
            max-width: 90%;
            font-size: 0.85em;
            line-height: 1.4;
            color: #aaa;
            word-break: break-word;
        }

        .color-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        .side-btn {
            flex: 1;
            padding: 10px 6px;
            cursor: pointer;
            background: #111;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 4px;
            font-weight: bold;
            font-family: inherit;
            font-size: 0.85rem;
            text-align: center;
        }

        .side-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: black;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .action-btn {
            padding: 10px 4px;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.82em;
            text-align: center;
            min-height: 40px;
        }

        .action-btn:hover {
            background: #333;
        }

        .highlight-last {
            background-color: rgba(41, 182, 246, 0.3) !important;
        }

        .highlight-sq {
            box-shadow: inset 0 0 3px 3px var(--accent-blue);
        }

        @media (max-width: 850px) {
            body {
                padding: 14px 10px 24px 10px;
            }

            #game-container {
                flex-direction: column;
                height: auto;
                align-items: center;
                gap: 14px;
            }

            #board {
                width: 100%;
                max-width: 480px;
            }

            #sidebar {
                width: 100%;
                max-width: 480px;
                padding: 14px;
            }

            #chat-window {
                height: 160px;
                min-height: 130px;
                max-height: 200px;
                flex: none;
            }

            .action-btn {
                padding: 10px 2px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>

    <h1>TIM_CHESS_v3.4_POLITE</h1>

    <div id="game-container">
        <div class="board-area-wrapper">
            <div class="eval-bar-container" title="Stockfish Evaluation">
                <div id="eval-bar-fill" class="eval-bar-fill"></div>
                <div id="eval-bar-text" class="eval-bar-text">0.0</div>
            </div>
            <div class="board-section">
                <div class="captured-row">
                    <div id="topCaptured" class="cap-pieces-list"></div>
                    <div id="topPlayerLabel" style="font-size: 0.8rem; color: #888;">Bot</div>
                </div>
                <div id="board"></div>
                <div class="captured-row">
                    <div id="bottomCaptured" class="cap-pieces-list"></div>
                    <div id="bottomPlayerLabel" style="font-size: 0.8rem; color: #888;">You</div>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <div id="status">SYSTEM: ONLINE</div>

            <div class="color-selector">
                <button id="playWhiteBtn" class="side-btn active">Play as White ♔</button>
                <button id="playBlackBtn" class="side-btn">Play as Black ♚</button>
            </div>

            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px; font-weight: bold;">MOVE LOG:</div>
            <div id="move-history" class="move-history-container" title="Move History"></div>

            <div id="chat-window">
                <div class="bubble">> Hello! Ready for a friendly game of chess?</div>
            </div>

            <form id="chat-form" class="chat-input-form" onsubmit="event.preventDefault(); window.sendUserChatMessage();">
                <input type="text" id="userChatInput" placeholder="Chat or banter with the bot..." autocomplete="off">
                <button type="submit" class="chat-send-btn">Send ↵</button>
            </form>

            <div class="controls">
                <button id="voiceToggleBtn" class="action-btn">🔊 VOICE</button>
                <button id="undoBtn" class="action-btn">UNDO_MOVE</button>
                <button id="rebootBtn" class="action-btn">REBOOT_SYS</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="openingBook.js"></script>
    <script src="voice.js"></script>

    <script type="module">
        import { playMoveSound, playCaptureSound, playCheckSound, playGameOverSound, playBotSound } from './chessAudio.js';
        import { showLegalMoveDots, clearLegalMoveDots, updateCapturedPieces, updateMoveHistoryUI, updateEvalBarUI, updateBotReactionUI, promptPawnPromotion } from './chessUI.js';

        const BOT_KEY = 'default';
        const game = new Chess();
        let board = null;
        let isThinking = false;
        let chatHistory = [];
        let playerColor = 'w';
        let sourceSquare = null;

        const sf = new Worker('./stockfish-18-lite-single.js');
        sf.postMessage('uci');
        sf.postMessage('setoption name UCI_Elo value 1400');

        function updateVoiceBtnUI() {
            $('#voiceToggleBtn').text(isVoiceMuted() ? '🔇 MUTED' : '🔊 VOICE');
        }

        $('#voiceToggleBtn').click(() => {
            toggleVoiceMute();
            updateVoiceBtnUI();
        });

        function refreshBoardUI() {
            const isPlayerWhite = playerColor === 'w';
            const topColor = isPlayerWhite ? 'b' : 'w';
            const bottomColor = isPlayerWhite ? 'w' : 'b';

            updateCapturedPieces(game, {
                whiteContainer: isPlayerWhite ? document.getElementById('bottomCaptured') : document.getElementById('topCaptured'),
                blackContainer: isPlayerWhite ? document.getElementById('topCaptured') : document.getElementById('bottomCaptured')
            });

            $('#topPlayerLabel').text(isPlayerWhite ? 'Bot (Black)' : 'Bot (White)');
            $('#bottomPlayerLabel').text(isPlayerWhite ? 'You (White)' : 'You (Black)');

            updateMoveHistoryUI(game, document.getElementById('move-history'));
        }

        sf.onmessage = async (e) => {
            if (typeof e.data === 'string') {
                if (e.data.startsWith('info') && e.data.includes('score')) {
                    const cpMatch = e.data.match(/score cp (-?\d+)/);
                    const mateMatch = e.data.match(/score mate (-?\d+)/);
                    if (cpMatch) {
                        let cp = parseInt(cpMatch[1], 10) / 100;
                        if (game.turn() === 'b') cp = -cp;
                        updateEvalBarUI(cp, false, playerColor);
                        updateBotReactionUI(BOT_KEY, cp, game.in_check(), game.game_over());
                    } else if (mateMatch) {
                        let mate = parseInt(mateMatch[1], 10);
                        if (game.turn() === 'b') mate = -mate;
                        updateEvalBarUI(mate, true, playerColor);
                        updateBotReactionUI(BOT_KEY, mate > 0 ? 10 : -10, game.in_check(), game.game_over());
                    }
                }

                if (e.data.startsWith('bestmove')) {
                    const moveStr = e.data.split(' ')[1];
                    if (!moveStr || moveStr === '(none)') return;

                    const botMove = game.move({
                        from: moveStr.slice(0, 2),
                        to: moveStr.slice(2, 4),
                        promotion: moveStr.length > 4 ? moveStr[4] : 'q'
                    });

                    if (botMove) {
                        board.position(game.fen());
                        updateHighlight(botMove);

                        if (botMove.captured) {
                            playCaptureSound();
                            playBotSound(BOT_KEY);
                        } else {
                            playMoveSound();
                        }

                        if (game.in_check()) playCheckSound();

                        refreshBoardUI();

                        if (game.game_over()) {
                            playGameOverSound(game.turn() !== playerColor);
                            handleGameOver();
                        } else {
                            $('#status').text("SYSTEM: YOUR TURN");
                        }

                        await getAIResponse(botMove, false);
                    }
                }
            }
        };

        function updateHighlight(move) {
            $('.square-55d63').removeClass('highlight-last');
            if (move) {
                $(`.square-${move.from}, .square-${move.to}`).addClass('highlight-last');
            }
        }

        function addMessage(text, id = null, isUser = false) {
            const idAttr = id ? `id="${id}"` : '';
            const userClass = isUser ? 'user-bubble' : '';
            $('#chat-window').append(`<div class="bubble ${userClass}" ${idAttr}>${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
            if (!isUser) speakVoice(text, BOT_KEY);
        }

        window.sendUserChatMessage = async function() {
            const input = document.getElementById('userChatInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text || isThinking) return;

            input.value = '';
            addMessage(text, null, true);

            chatHistory.push({ role: 'user', parts: [{ text: `HUMAN_CHAT: ${text}` }] });
            const msgId = `msg-${Date.now()}`;
            addMessage("> PROCESSING RESPONSE...", msgId, false);

            try {
                const res = await fetch('/api/commentary-stockfish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${msgId}`).html("> ");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    const clean = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    $(`#${msgId}`).text("> " + clean);
                    $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
                }

                if (fullText) {
                    const cleanText = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    chatHistory.push({ role: 'model', parts: [{ text: cleanText }] });
                    speakVoice(cleanText, BOT_KEY);
                }
            } catch (err) {
                console.error(err);
                $(`#${msgId}`).text("> ERROR: STREAM INTERRUPTED");
                chatHistory.pop();
            }
        };

        async function handleGameOver() {
            let resultMsg = "> GAME OVER: ";
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Black' : 'White';
                resultMsg += `CHECKMATE! ${winner} wins!`;
            } else if (game.in_draw()) {
                resultMsg += "DRAW / STALEMATE!";
            }
            $('#status').text(resultMsg);
            addMessage(resultMsg);
        }

        async function getAIResponse(move, isUser) {
            if (isThinking) return;
            isThinking = true;
            const promptRole = isUser ? `HUMAN: ${move.san}` : `BOT: ${move.san}`;
            chatHistory.push({ role: 'user', parts: [{ text: promptRole }] });

            const msgId = `msg-${Date.now()}`;
            addMessage("> PROCESSING...", msgId);

            try {
                const res = await fetch('/api/commentary-stockfish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${msgId}`).html("> ");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    const clean = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    $(`#${msgId}`).text("> " + clean);
                    $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
                }

                if (fullText) {
                    const cleanText = fullText.replace(/^(HUMAN|BOT|STOCKFISH|FWOG|KOOPA|TURTLE|MARTINA|TIMMY|ANTIGRAVITY|CHICKEN):\s*/gi, '').trim();
                    chatHistory.push({ role: 'model', parts: [{ text: cleanText }] });
                    speakVoice(cleanText, BOT_KEY);
                }
            } catch (err) {
                console.error(err);
                $(`#${msgId}`).text("> ERROR: STREAM INTERRUPTED");
                chatHistory.pop();
            } finally {
                isThinking = false;
            }
        }

        async function makeBotMove() {
            if (game.game_over()) return;

            const bookMove = window.getOpeningBookMove ? window.getOpeningBookMove(game, 'default') : null;
            if (bookMove) {
                const botMove = game.move(bookMove);
                if (botMove) {
                    board.position(game.fen());
                    updateHighlight(botMove);

                    if (botMove.captured) {
                        playCaptureSound();
                        playBotSound(BOT_KEY);
                    } else {
                        playMoveSound();
                    }

                    if (game.in_check()) playCheckSound();

                    refreshBoardUI();

                    if (game.game_over()) {
                        playGameOverSound(game.turn() !== playerColor);
                        handleGameOver();
                    } else {
                        $('#status').text("SYSTEM: YOUR TURN");
                    }

                    await getAIResponse(botMove, false);
                    return;
                }
            }

            $('#status').text("SYSTEM: STOCKFISH THINKING...");
            sf.postMessage(`position fen ${game.fen()}`);
            sf.postMessage('go movetime 700');
        }

        async function resetGame() {
            game.reset();
            chatHistory = [];
            board.position('start');
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            $('.square-55d63').removeClass('highlight-last highlight-sq');
            clearLegalMoveDots();
            sourceSquare = null;

            $('#playWhiteBtn').toggleClass('active', playerColor === 'w');
            $('#playBlackBtn').toggleClass('active', playerColor === 'b');

            updateEvalBarUI(0, false, playerColor);
            updateBotReactionUI(BOT_KEY, 0, false, false);
            refreshBoardUI();

            const intro = '> SYSTEM ONLINE. PLAYING AS ' + (playerColor === 'w' ? 'WHITE' : 'BLACK') + '.';
            $('#chat-window').html('<div class="bubble">' + intro + '</div>');
            speakVoice(intro, BOT_KEY);

            if (playerColor === 'b') {
                await makeBotMove();
            }
        }

        $('#playWhiteBtn').click(() => { playerColor = 'w'; resetGame(); });
        $('#playBlackBtn').click(() => { playerColor = 'b'; resetGame(); });
        $('#rebootBtn').click(() => resetGame());

        function executePlayerMove(from, to, promotion = 'q') {
            const move = game.move({ from, to, promotion });
            $('.square-55d63').removeClass('highlight-sq');
            clearLegalMoveDots();

            if (move) {
                board.position(game.fen());
                updateHighlight(move);

                if (move.captured) {
                    playCaptureSound();
                } else {
                    playMoveSound();
                }

                if (game.in_check()) playCheckSound();

                refreshBoardUI();

                if (game.game_over()) {
                    playGameOverSound(!game.in_checkmate() || game.turn() !== playerColor);
                    handleGameOver();
                } else {
                    $('#status').text("SYSTEM: COMMENTATING...");
                    getAIResponse(move, true).then(() => {
                        if (!game.game_over()) {
                            makeBotMove();
                        }
                    });
                }
            }
            sourceSquare = null;
        }

        async function onSquareClick() {
            const square = $(this).attr('data-square');
            if (game.game_over() || isThinking) return;

            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === playerColor && game.turn() === playerColor) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                    showLegalMoveDots(game, square);
                }
            } else {
                if (square === sourceSquare) {
                    sourceSquare = null;
                    $('.square-55d63').removeClass('highlight-sq');
                    clearLegalMoveDots();
                    return;
                }

                const piece = game.get(sourceSquare);
                const isPromo = piece && piece.type === 'p' && ((piece.color === 'w' && square[1] === '8') || (piece.color === 'b' && square[1] === '1'));

                // Verify if it's a legal move target
                const legalMoves = game.moves({ square: sourceSquare, verbose: true });
                const isLegal = legalMoves.some(m => m.to === square);

                if (isLegal) {
                    if (isPromo) {
                        promptPawnPromotion(playerColor, (chosenPiece) => {
                            executePlayerMove(sourceSquare, square, chosenPiece);
                        });
                    } else {
                        executePlayerMove(sourceSquare, square, 'q');
                    }
                } else {
                    // Check if clicked another friendly piece
                    const clickedPiece = game.get(square);
                    if (clickedPiece && clickedPiece.color === playerColor) {
                        sourceSquare = square;
                        $('.square-55d63').removeClass('highlight-sq');
                        $('.square-' + square).addClass('highlight-sq');
                        showLegalMoveDots(game, square);
                    } else {
                        sourceSquare = null;
                        $('.square-55d63').removeClass('highlight-sq');
                        clearLegalMoveDots();
                    }
                }
            }
        }

        $(document).ready(() => {
            updateVoiceBtnUI();
            board = Chessboard('board', {
                position: 'start',
                draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(document).on('click', '.square-55d63', onSquareClick);
            $(window).on('resize', () => {
                if (board) board.resize();
            });
            refreshBoardUI();
        });

        $('#undoBtn').click(() => {
            game.undo();
            game.undo();
            board.position(game.fen());
            clearLegalMoveDots();
            $('.square-55d63').removeClass('highlight-sq highlight-last');
            sourceSquare = null;
            chatHistory = chatHistory.slice(0, -4);
            refreshBoardUI();
            addMessage("> MEMORY PARTIALLY PURGED. RETURNING TO PREVIOUS STATE.");
        });
    </script>
</body>

</html>
