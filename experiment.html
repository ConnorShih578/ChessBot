<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess Experimental Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0a0a0a; --text: #00ff41; --accent: #008f11; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        #game-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; max-width: 900px; }
        #board { width: 400px; border: 2px solid var(--accent); }
        #sidebar { width: 350px; height: 400px; background: #111; padding: 15px; display: flex; flex-direction: column; border: 1px solid var(--accent); box-sizing: border-box; }
        #chat-window { flex: 1; background: #000; padding: 10px; overflow-y: auto; border: 1px solid #222; font-size: 0.85em; margin-bottom: 10px; }
        .bubble { margin-bottom: 8px; border-left: 2px solid var(--accent); padding-left: 8px; color: #00ff41; }
        #status { font-size: 0.7em; color: var(--accent); margin-bottom: 5px; height: 15px; }
        button { padding: 8px; cursor: pointer; background: #002200; color: var(--text); border: 1px solid var(--accent); font-family: inherit; font-size: 0.8em; }
        .highlight-last { background-color: rgba(0, 143, 17, 0.4) !important; }
    </style>
</head>
<body>

    <h2 style="margin: 10px 0;">TIM_CHESS_v2.0_SMOL</h2>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status">INITIALIZING...</div>
            <div id="chat-window"><div class="bubble">> STANDBY for neural link...</div></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button id="undoBtn">UNDO_MOVE</button>
                <button onclick="location.reload()">REBOOT_SYS</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const game = new Chess();
        let board = null;
        let llm = null;
        let isThinking = false;
        let history = [];

        // Engine setup
        const sf = new Worker('./stockfish-18-lite-single.js');
        sf.postMessage('uci');
        sf.postMessage('setoption name UCI_Elo value 1400');

        sf.onmessage = (e) => {
            if (e.data.startsWith('bestmove')) {
                const m = e.data.split(' ')[1];
                const move = game.move({ from: m.slice(0, 2), to: m.slice(2, 4), promotion: 'q' });
                board.position(game.fen());
                highlight(move);
                getCommentary(move, false);
                $('#status').text("YOUR TURN");
            }
        };

        async function init() {
            try {
                // Best model for 4GB RAM devices
                const model = "SmolLM2-360M-Instruct-q4f16_1-MLC";
                llm = await webllm.CreateMLCEngine(model, {
                    initProgressCallback: (p) => $('#status').text(`LOADING_BRAIN: ${Math.round(p.progress * 100)}%`)
                });
                $('#status').text("ONLINE");
            } catch (err) { $('#status').text("CORE_OFFLINE"); }
        }

        async function getCommentary(move, isUser) {
            if (!llm || isThinking) return;
            isThinking = true;

            const moveText = isUser ? `User played ${move.san}.` : `I played ${move.san}.`;
            history.push({ role: "user", content: moveText });
            if (history.length > 4) history.shift(); // Ultra-lean history for low RAM

            try {
                const res = await llm.chat.completions.create({
                    messages: [
                        { role: "system", content: "You are a witty, competitive chess bot. One short sentence only. Talk about the current move." },
                        ...history
                    ],
                    temperature: 0.6,
                    max_tokens: 25
                });
                const reply = res.choices[0].message.content.trim().replace(/^(Bot:|Tim:|>)/i, "");
                $('#chat-window').append(`<div class="bubble">> ${reply}</div>`).scrollTop(999);
                history.push({ role: "assistant", content: reply });
            } finally { isThinking = false; }
        }

        function highlight(move) {
            $('.square-55d63').removeClass('highlight-last');
            $(`.square-${move.from}, .square-${move.to}`).addClass('highlight-last');
        }

        $(document).ready(() => {
            board = Chessboard('board', { position: 'start', draggable: true,
                onDrop: (s, t) => {
                    const m = game.move({ from: s, to: t, promotion: 'q' });
                    if (!m) return 'snapback';
                    highlight(m);
                    sf.postMessage(`position fen ${game.fen()}`);
                    sf.postMessage('go movetime 600');
                    getCommentary(m, true);
                    $('#status').text("TIM_THINKING...");
                }
            });
            init();
        });

        $('#undoBtn').click(() => { game.undo(); game.undo(); board.position(game.fen()); });
    </script>
</body>
</html>
