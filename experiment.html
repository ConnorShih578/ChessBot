<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess Experimental Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0a0a0a; --text: #00ff41; --accent: #008f11; --terminal: #002200; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #game-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 1000px; }
        #board { width: 450px; border: 3px solid var(--accent); box-shadow: 0 0 20px var(--terminal); }
        #sidebar { width: 380px; height: 450px; background: #111; padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--accent); box-sizing: border-box; }
        #chat-window { flex: 1; background: #000; padding: 12px; overflow-y: auto; border: 1px solid #222; font-size: 0.9em; margin-bottom: 15px; color: #00ff41; }
        .bubble { margin-bottom: 10px; border-left: 2px solid var(--accent); padding-left: 10px; line-height: 1.4; }
        #status { font-size: 0.75em; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; cursor: pointer; background: var(--terminal); color: var(--text); border: 1px solid var(--accent); font-family: inherit; }
        button:hover { background: var(--accent); color: #000; }
        .highlight-last { background-color: rgba(0, 143, 17, 0.4) !important; }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">TIM_CHESS_v3.4_ANALYTICAL</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status">INITIALIZING_SYSTEM...</div>
            <div id="chat-window">
                <div class="bubble">> NEURAL LINK STANDBY.</div>
            </div>
            <div class="controls">
                <button id="undoBtn">UNDO_MOVE</button>
                <button onclick="location.reload()">REBOOT_SYS</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const game = new Chess();
        let board = null;
        let llm = null;
        let isThinking = false;
        let chatHistory = [];

        const sf = new Worker('./stockfish-18-lite-single.js');
        sf.postMessage('uci');
        sf.postMessage('setoption name UCI_Elo value 1400');

        sf.onmessage = (e) => {
            if (e.data.startsWith('bestmove')) {
                const moveStr = e.data.split(' ')[1];
                if (moveStr && moveStr !== '(none)') {
                    const move = game.move({ from: moveStr.slice(0, 2), to: moveStr.slice(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    updateHighlight(move);
                    getAIResponse(move, false);
                    $('#status').text("SYSTEM: YOUR TURN");
                }
            }
        };

        async function initAI() {
            try {
                const modelId = "SmolLM2-360M-Instruct-q4f16_1-MLC";
                llm = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (p) => $('#status').text(`LOADING_BRAIN: ${Math.round(p.progress * 100)}%`)
                });
                $('#status').text("SYSTEM: ONLINE");
            } catch (err) {
                $('#status').text("SYSTEM: CORE_FAILURE");
            }
        }

        function addMessage(text) {
            $('#chat-window').append(`<div class="bubble">> ${text}</div>`).scrollTop(9999);
        }

        async function getAIResponse(move, isUser) {
            if (!llm || isThinking) return;
            isThinking = true;

            // PERSONA RANDOMIZER: We pick a different "vibe" for each move to prevent repetition
            const vibes = [
                "Focus on the tactical pressure of this move.",
                "Describe the geometric logic of the piece placement.",
                "Comment on the psychological tension created by this move.",
                "Describe this move using futuristic system diagnostics jargon.",
                "Be dismissive but technically descriptive of this position."
            ];
            const currentVibe = vibes[Math.floor(Math.random() * vibes.length)];

            const userPrompt = isUser 
                ? `Analyze Human Move: ${move.san}. ${currentVibe}` 
                : `Analyze My Move: ${move.san}. ${currentVibe}`;

            chatHistory.push({ role: "user", content: userPrompt });
            if (chatHistory.length > 4) chatHistory.shift();

            try {
                const res = await llm.chat.completions.create({
                    messages: [
                        { 
                            role: "system", 
                            content: `You are the Tim Chess Experimental Bot. 
                            GOAL: Provide a fresh, descriptive, high-tech analysis.
                            RULES: 
                            1. Use ONE sentence. 
                            2. NEVER use the words 'solid', 'technically sound', or 'aggressive'. 
                            3. Use diverse vocabulary like 'spatial', 'leverage', 'grid-lock', 'optimization', or 'vulnerability'.` 
                        },
                        ...chatHistory
                    ],
                    temperature: 0.8, // Keep it high for descriptive variety
                    presence_penalty: 1.2, 
                    frequency_penalty: 1.2,
                    max_tokens: 40
                });

                let reply = res.choices[0].message.content.trim();
                
                // Clean up any prefixes or hallucinations
                reply = reply.split('\n')[0];
                reply = reply.replace(/^(Tim:|Bot:|Human|>)/i, "").trim();

                addMessage(reply);
                chatHistory.push({ role: "assistant", content: reply });
            } catch (e) {
                console.error("AI Error:", e);
            } finally {
                isThinking = false;
            }
        }

        function updateHighlight(move) {
            $('.square-55d63').removeClass('highlight-last');
            $(`.square-${move.from}, .square-${move.to}`).addClass('highlight-last');
        }

        $(document).ready(() => {
            board = Chessboard('board', {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    const move = game.move({ from: source, to: target, promotion: 'q' });
                    if (!move) return 'snapback';
                    updateHighlight(move);
                    sf.postMessage(`position fen ${game.fen()}`);
                    sf.postMessage('go movetime 700');
                    getAIResponse(move, true);
                    $('#status').text("SYSTEM: ANALYZING...");
                }
            });
            initAI();
        });

        $('#undoBtn').click(() => {
            game.undo(); game.undo();
            board.position(game.fen());
            chatHistory = [];
            addMessage("MEMORY PURGED. RETURNING TO PREVIOUS STATE.");
        });
    </script>
</body>
</html>
