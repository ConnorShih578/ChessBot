<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess Experimental Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #0a0a0a; --text: #00ff41; --accent: #008f11; --terminal: #002200; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #game-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 1000px; }
        #board { width: 450px; border: 3px solid var(--accent); box-shadow: 0 0 20px var(--terminal); }
        #sidebar { width: 380px; height: 450px; background: #111; padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--accent); box-sizing: border-box; }
        #chat-window { flex: 1; background: #000; padding: 12px; overflow-y: auto; border: 1px solid #222; font-size: 0.9em; margin-bottom: 15px; color: #00ff41; }
        .bubble { margin-bottom: 10px; border-left: 2px solid var(--accent); padding-left: 10px; line-height: 1.4; }
        #status { font-size: 0.75em; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; cursor: pointer; background: var(--terminal); color: var(--text); border: 1px solid var(--accent); font-family: inherit; }
        button:hover { background: var(--accent); color: #000; }
        .highlight-last { background-color: rgba(0, 143, 17, 0.4) !important; }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">TIM_CHESS_v3.4_ANALYTICAL</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status">INITIALIZING_SYSTEM...</div>
            <div id="api-key-container" style="margin-bottom: 12px; display: flex; gap: 8px;">
                <input type="password" id="apiKeyInput" placeholder="ENTER_GEMINI_API_KEY" style="flex: 1; background: #000; color: var(--text); border: 1px solid var(--accent); padding: 8px; font-family: inherit; font-size: 0.85em; outline: none; border-radius: 2px;">
                <button id="saveKeyBtn" style="padding: 8px 12px; font-size: 0.85em;">SET</button>
            </div>
            <div id="chat-window">
                <div class="bubble">> NEURAL LINK STANDBY.</div>
            </div>
            <div class="controls">
                <button id="undoBtn">UNDO_MOVE</button>
                <button onclick="location.reload()">REBOOT_SYS</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { GoogleGenAI } from "https://esm.sh/@google/genai";

        const game = new Chess();
        let board = null;
        let isThinking = false;
        let chatHistory = [];

        const sf = new Worker('./stockfish-18-lite-single.js');
        sf.postMessage('uci');
        sf.postMessage('setoption name UCI_Elo value 1400');

        sf.onmessage = (e) => {
            if (e.data.startsWith('bestmove')) {
                const moveStr = e.data.split(' ')[1];
                if (moveStr && moveStr !== '(none)') {
                    const move = game.move({ from: moveStr.slice(0, 2), to: moveStr.slice(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    updateHighlight(move);
                    getAIResponse(move, false);
                    $('#status').text("SYSTEM: YOUR TURN");
                }
            }
        };

        function getEffectiveApiKey() {
            return localStorage.getItem('gemini_api_key') || '';
        }

        function initAI() {
            const savedKey = localStorage.getItem('gemini_api_key') || '';
            if (savedKey) {
                $('#apiKeyInput').val(savedKey);
                $('#status').text("SYSTEM: ONLINE");
            } else {
                $('#status').text("SYSTEM: ENTER API KEY");
            }
        }

        function saveApiKey() {
            const key = $('#apiKeyInput').val().trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                $('#status').text("SYSTEM: ONLINE");
                addMessage("API KEY UPDATED. SYSTEM ONLINE.");
            } else {
                localStorage.removeItem('gemini_api_key');
                $('#status').text("SYSTEM: ENTER API KEY");
                addMessage("API KEY REMOVED. SYSTEM OFFLINE.");
            }
        }

        $('#saveKeyBtn').click(saveApiKey);
        $('#apiKeyInput').keypress((e) => {
            if (e.which === 13) {
                saveApiKey();
            }
        });

        function addMessage(text) {
            $('#chat-window').append(`<div class="bubble">> ${text}</div>`).scrollTop(9999);
        }

        async function getAIResponse(move, isUser) {
            const apiKey = getEffectiveApiKey();

            if (isThinking) return;
            isThinking = true;

            const inputPrompt = isUser ? `HUMAN: ${move.san}` : `STOCKFISH: ${move.san}`;
            chatHistory.push({
                role: 'user',
                parts: [{ text: inputPrompt }]
            });

            const bubbleId = `msg-${Date.now()}`;
            $('#chat-window').append(`<div class="bubble" id="${bubbleId}">> <span style="color: var(--accent);">Thinking...</span></div>`).scrollTop(9999);

            try {
                const response = await fetch('/api/commentary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory, apiKey })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                $(`#${bubbleId}`).html("> ");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    $(`#${bubbleId}`).text("> " + fullText);
                    $('#chat-window').scrollTop(9999);
                }

                if (!fullText) {
                    $(`#${bubbleId}`).text("> (No response received)");
                } else {
                    chatHistory.push({
                        role: 'model',
                        parts: [{ text: fullText }]
                    });
                }

            } catch (e) {
                console.error("AI Error:", e);
                $(`#${bubbleId}`).text(`> ERROR: Failed to generate response. ${e.message}`);
                chatHistory.pop();
            } finally {
                isThinking = false;
            }
        }

        function updateHighlight(move) {
            $('.square-55d63').removeClass('highlight-last');
            $(`.square-${move.from}, .square-${move.to}`).addClass('highlight-last');
        }

        $(document).ready(() => {
            board = Chessboard('board', {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    const move = game.move({ from: source, to: target, promotion: 'q' });
                    if (!move) return 'snapback';
                    updateHighlight(move);
                    sf.postMessage(`position fen ${game.fen()}`);
                    sf.postMessage('go movetime 700');
                    getAIResponse(move, true);
                    $('#status').text("SYSTEM: ANALYZING...");
                }
            });
            initAI();
        });

        $('#undoBtn').click(() => {
            game.undo(); game.undo();
            board.position(game.fen());
            chatHistory = chatHistory.slice(0, -4);
            addMessage("MEMORY PARTIALLY PURGED. RETURNING TO PREVIOUS STATE.");
        });
    </script>
</body>
</html>
