<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess - Experimental Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg: #121212;
            --sidebar: #1e1e1e;
            --text: #00ff41; /* Terminal Green */
            --accent: #008f11;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; 
        }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; }
        #board { width: 550px; flex-shrink: 0; border: 4px solid var(--accent); }
        #sidebar { 
            flex: 1; background: var(--sidebar); border-radius: 10px; 
            padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--accent);
        }
        #chat-window { 
            flex: 1; background: #000; border-radius: 5px; padding: 15px; 
            overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--accent);
            font-size: 0.9em;
        }
        .bubble { margin-bottom: 10px; line-height: 1.4; border-bottom: 1px solid #222; padding-bottom: 5px; }
        #status-bar { font-size: 0.8em; color: #888; margin-bottom: 10px; }
        button { 
            padding: 10px; cursor: pointer; background: var(--accent); 
            color: #000; border: none; font-weight: bold; margin-top: 5px; width: 100%;
        }
        footer { margin-top: 20px; color: #444; font-size: 0.7em; }
    </style>
</head>
<body>

    <h1>EXPERIMENTAL_BOT_v1.1</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status-bar">SYSTEM: BOOTING...</div>
            <div id="chat-window">
                <div class="bubble">> SYSTEM READY. WAITING FOR AI...</div>
            </div>
            <button onclick="location.reload()">REBOOT SYSTEM</button>
        </div>
    </div>

    <footer>This bot and page was made with AI</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        var board = null;
        var game = new Chess();
        var llm = null;
        var currentEval = "0.0";
        
        // Use a more reliable Stockfish CDN link
        var engine = new Worker('https://cdn.jsdelivr.net/npm/stockfish/src/stockfish.js');

        async function initAI() {
            const modelId = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
            try {
                llm = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (p) => {
                        $('#status-bar').text(`AI LOADING: ${Math.round(p.progress * 100)}%`);
                    }
                });
                $('#status-bar').text("SYSTEM: ONLINE | READY");
                speak("AI Brain linked. Make your move, human.");
            } catch (e) {
                $('#status-bar').text("SYSTEM: AI ERROR");
                console.error(e);
            }
        }

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">> ${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        async function getAIResponse(userMove) {
            if (!llm) return;
            const prompt = `You are a witty, slightly mean chess bot. The user just moved ${userMove}. The board FEN is ${game.fen()}. The evaluation is ${currentEval}. Write a 1-sentence snarky comment.`;
            
            const response = await llm.chat.completions.create({
                messages: [
                    { role: "system", content: "You are a witty chess bot." },
                    { role: "user", content: prompt }
                ]
            });
            speak(response.choices[0].message.content);
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            $('#status-bar').text("SYSTEM: CALCULATING...");
            
            // Stockfish logic
            engine.postMessage('uci');
            engine.postMessage('position fen ' + game.fen());
            engine.postMessage('go depth 12');
            
            // Get AI Commentary for your move
            getAIResponse(move.san);
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                currentEval = e.data.split('cp ')[1].split(' ')[0];
            }
            if (e.data.startsWith('bestmove')) {
                var moveStr = e.data.split(' ')[1];
                var move = game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('#status-bar').text("SYSTEM: AWAITING INPUT");
            }
        };

        $(document).ready(function() {
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDrop: onDrop,
                // FIXED: Direct link to pieces so they are never invisible
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            initAI();
        });
    </script>
</body>
</html>
