<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess Experimental Bot</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg: #0d0d0d;
            --sidebar: #1a1a1a;
            --text: #00ff41;
            --accent: #008f11;
            --terminal: #003b00;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; 
        }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 20px; }
        #board { width: 550px; flex-shrink: 0; border: 2px solid var(--accent); }
        #sidebar { 
            flex: 1; background: var(--sidebar); border-radius: 4px; 
            padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--accent);
        }
        #chat-window { 
            flex: 1; background: #000; border-radius: 4px; padding: 15px; 
            overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--terminal);
            font-size: 0.9em; color: var(--text);
        }
        .bubble { margin-bottom: 12px; border-left: 2px solid var(--accent); padding-left: 10px; line-height: 1.4; }
        #status-bar { font-size: 0.7em; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
        button { 
            padding: 12px; cursor: pointer; background: var(--terminal); 
            color: var(--text); border: 1px solid var(--accent); font-family: inherit;
        }
        button:hover { background: var(--accent); color: #000; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px var(--accent); }
        .highlight-last { background-color: rgba(0, 143, 17, 0.4) !important; }
    </style>
</head>
<body>

    <h1>TIM_CHESS_EXPERIMENTAL</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div id="status-bar">SYSTEM: INITIALIZING...</div>
            <div id="chat-window">
                <div class="bubble">> NEURAL LINK INITIALIZED.</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button id="undoBtn">UNDO_MOVE</button>
                <button onclick="location.reload()">REBOOT_SYS</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // Global State
        window.board = null;
        window.game = new Chess();
        window.sourceSquare = null;
        window.llm = null;
        window.isAiThinking = false;
        window.chatHistory = []; // The AI's Memory

        // Stockfish Engine Setup
        window.engine = new Worker('./stockfish-18-lite-single.js');
        engine.postMessage('uci');
        engine.postMessage('setoption name UCI_LimitStrength value true');
        engine.postMessage('setoption name UCI_Elo value 1800');

        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                if (m && m !== '(none)') {
                    var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    updateHighlights(move);
                    $('#status-bar').text("SYSTEM: YOUR TURN");
                    getAICommentary(move, false);
                }
            }
        };

        async function initAI() {
            const modelId = "gemma-2b-it-q4f16_1-MLC"; 
            try {
                window.llm = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (p) => {
                        $('#status-bar').text(`DOWNLOADING_BRAIN: ${Math.round(p.progress * 100)}%`);
                    }
                });
                $('#status-bar').text("SYSTEM: ONLINE");
                speak("Experimental Bot active. Ready to process moves.");
            } catch (e) {
                $('#status-bar').text("SYSTEM: CORE_FAILURE");
                console.error(e);
            }
        }

        window.speak = function(text) {
            $('#chat-window').append(`<div class="bubble">> ${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        async function getAICommentary(moveObj, isPlayer) {
            if (!window.llm || isAiThinking) return;
            isAiThinking = true;

            const san = moveObj.san;
            const piece = { 'p': 'pawn', 'n': 'knight', 'b': 'bishop', 'r': 'rook', 'q': 'queen', 'k': 'king' }[moveObj.piece.toLowerCase()];
            
            // Build Context for the AI
            const context = isPlayer 
                ? `The human (White) moved ${san} (${piece}).` 
                : `You (the Bot/Black) moved ${san} (${piece}).`;

            // Add latest move to memory
            chatHistory.push({ role: "user", content: context });
            if (chatHistory.length > 12) chatHistory.shift(); // Keep memory lean

            try {
                const response = await llm.chat.completions.create({
                    messages: [
                        { 
                            role: "system", 
                            content: `You are the Tim Chess Experimental Bot. You are BLACK. User is WHITE.
                            - You have a memory of the previous moves provided below.
                            - React to the LATEST move: ${san}.
                            - Use one short, competitive sentence.
                            - No 'AI assistant' jargon. No teaching.
                            - If a piece was captured (x), mention it.` 
                        },
                        ...chatHistory
                    ],
                    temperature: 0.5,
                    max_tokens: 40,
                    stop: ["\n", "User:", "White:", "Black:"]
                });

                let text = response.choices[0].message.content.trim();
                text = text.replace(/^(Bot:|Experimental Bot:|Tim Chess:|Tim:|>)/i, "").trim();

                // Save Bot's response to memory
                chatHistory.push({ role: "assistant", content: text });
                
                if (text) speak(text);
            } catch (e) {
                console.error("AI Memory Error:", e);
            } finally {
                isAiThinking = false;
            }
        }

        function updateHighlights(move) {
            $('.square-55d63').removeClass('highlight-last');
            $('.square-' + move.from + ', .square-' + move.to).addClass('highlight-last');
        }

        window.onSquareClick = function() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;

            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                
                if (move) {
                    board.position(game.fen());
                    updateHighlights(move);
                    
                    $('#status-bar').text("SYSTEM: ANALYZING...");
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go movetime 800'); 
                    getAICommentary(move, true); // Pass the move object
                }
                sourceSquare = null;
            }
        }

        $(document).ready(function() {
            window.board = Chessboard('board', { 
                position: 'start', draggable: false, 
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
            });
            $(document).on('click', '.square-55d63', onSquareClick);
            initAI();
        });

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); 
            chatHistory.pop(); chatHistory.pop(); // Remove from AI memory too
            board.position(game.fen());
            $('.square-55d63').removeClass('highlight-last');
            speak("Logic reversal successful. Memory adjusted.");
        });
    </script>
</body>
</html>
