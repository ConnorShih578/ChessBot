<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess: Experimental Bot</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        /* Fix for invisible board: Explicit width is required */
        #board { width: 400px; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #status-bar { background: #333; width: 400px; padding: 10px; text-align: center; font-family: monospace; border-radius: 0 0 5px 5px; border-top: 1px solid #444; }
        #ai-log { width: 400px; height: 100px; overflow-y: auto; background: #000; padding: 10px; margin-top: 10px; font-size: 0.9em; border: 1px solid #444; }
        footer { margin-top: 20px; font-size: 0.7em; color: #666; }
    </style>
</head>
<body>

    <h2>TIM CHESS <span style="font-size: 0.5em; color: #00ff00;">(EXPERIMENTAL)</span></h2>
    
    <div id="board"></div>
    <div id="status-bar">INITIALIZING ENGINES...</div>
    <div id="ai-log"></div>

    <footer>AI notice: This bot uses an in-browser LLM (Qwen 2.5 0.5B) for commentary.</footer>

    <!-- JQuery and Chessboard.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        // Import WebLLM from ESM CDN
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let board = null;
        let game = new Chess();
        let engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        let llm = null;

        // 1. Initialize Board (Fixed visibility)
        function initBoard() {
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDrop: handleMove
            });
            $('#status-bar').text("BOARD READY. LOADING AI...");
        }

        // 2. Initialize WebLLM (Qwen 2.5 0.5B)
        async function initAI() {
            const modelId = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
            try {
                llm = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (p) => {
                        const progress = Math.round(p.progress * 100);
                        $('#status-bar').text(`AI LOADING: ${progress}%`);
                    }
                });
                $('#status-bar').text("MODEL: ONLINE | YOUR TURN");
            } catch (e) {
                console.error(e);
                $('#status-bar').text("AI ERROR: CHECK CONSOLE");
            }
        }

        // 3. Move Handling & Bot Logic
        function handleMove(source, target) {
            let move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            $('#status-bar').text("STOCKFISH IS THINKING...");
            engine.postMessage('uci');
            engine.postMessage(`position fen ${game.fen()}`);
            engine.postMessage('go depth 12');
        }

        engine.onmessage = function(event) {
            if (event.data.startsWith('bestmove')) {
                const moveStr = event.data.split(' ')[1];
                game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                generateCommentary();
            }
        };

        // 4. AI Commentary via WebLLM
        async function generateCommentary() {
            if (!llm) return;
            const prompt = `Short snarky comment on this chess FEN: ${game.fen()}`;
            const response = await llm.chat.completions.create({
                messages: [{ role: "user", content: prompt }]
            });
            const text = response.choices[0].message.content;
            $('#ai-log').prepend(`<p><strong>Bot:</strong> ${text}</p>`);
            $('#status-bar').text("YOUR TURN");
        }

        // Start Up
        initBoard();
        initAI();
    </script>
</body>
</html>
