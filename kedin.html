<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tim Chess - Gween Fwog</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #e8f5e9;
            --sidebar-color: #c8e6c9;
            --fwog-dark: #2e7d32;
            --fwog-light: #4caf50;
            --cheat-red: #d32f2f;
        }

        body {
            background-color: var(--bg-color); color: var(--fwog-dark);
            font-family: 'Comic Neue', 'Comic Sans MS', cursive;
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px;
        }

        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; }
        #board { width: 550px; flex-shrink: 0; border: 8px solid var(--fwog-light); border-radius: 20px; overflow: hidden; }

        #sidebar {
            flex: 1; background-color: var(--sidebar-color); border-radius: 30px;
            padding: 20px; display: flex; flex-direction: column;
            border: 4px solid var(--fwog-dark);
        }

        .bot-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .avatar {
            width: 65px; height: 65px; background-color: var(--fwog-light);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 2.2em; border: 4px solid white;
        }

        #chat-window {
            flex: 1; background: white; border-radius: 20px; padding: 15px;
            overflow-y: auto; margin-bottom: 15px; border: 2px dashed var(--fwog-dark);
        }

        .bubble {
            background: #f1f8e9; padding: 12px; border-radius: 18px;
            border-bottom-left-radius: 2px; align-self: flex-start;
            margin-bottom: 10px; border: 1px solid var(--fwog-light); font-weight: bold;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            padding: 12px; cursor: pointer; background: var(--fwog-light);
            color: white; border: none; border-radius: 25px;
            font-weight: bold; font-family: inherit; font-size: 1.1em;
        }

        #officialResult { color: var(--cheat-red); font-weight: bold; display: none; text-align: center; margin-top: 5px; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px #a5d6a7; }
        .highlight-last { background-color: rgba(129, 199, 132, 0.6) !important; }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            75% { transform: rotate(-1deg); }
        }
        .victory-shake { animation: shake 0.2s infinite; }
    </style>
</head>
<body>

    <h1 style="font-size: 2.5em; margin-bottom: 10px;">🐸 Gween Fwog Chess 🐸</h1>

    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div class="bot-profile">
                <div class="avatar">🐸</div>
                <div>
                    <h3 style="margin:0;">Gween Fwog</h3>
                    <div id="officialResult">YOU WON! (Fwog Cheated)</div>
                </div>
            </div>
            <div id="chat-window">
                <div class="bubble">Wibbit! Let's have a sensible game.</div>
            </div>
            <div class="controls">
                <button id="undoBtn">Undo?</button>
                <button onclick="location.reload()">New Game</button>
            </div>
        </div>
    </div>

    <footer><p>This bot and page was made with AI</p></footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, currentEval = 0.0;
        engine.postMessage('uci'); engine.postMessage('setoption name UCI_LimitStrength value true'); engine.postMessage('setoption name UCI_Elo value 950');

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        const frogQuotes = {
            thinking: [
                "Wibbit... thinking...", 
                "Searching for fwies...", 
                "Contempwating the wiwypad...",
                "Staring intenswy at a bug...",
                "Hop... hop... thinking...",
                "Wait! A dwagonfwy! Oh, right, chess."
            ],
            winning: [
                "I'm the king of the pond! Wibbit!",
                "You're stuck in the mud now!",
                "My gween machine is unstoppabwe!",
                "Tasty moves! Like a cwunchy beetle!",
                "You're pwaying wike a toad!"
            ],
            losing: [
                "Oh no! My wiwypad is sinking!",
                "Is it waining? I can't concentwate!",
                "That move was mean! Wibbit!",
                "I think my tongue is stuck...",
                "Would you wike to dwaw? I have mate in two by the way."
            ],
            neutral: [
                "Wibbit.", 
                "Wibbit. Who's winning?",
                "Do you have any snacks? Wibbit.",
                "Is it my turn yet? I was napping.",
                "The pond is quiet today.",
                "I wike your pieces. Can I eat the knight?"
            ],
            victory: [
                "WIBBIT! THE POND IS MINE!", 
                "Checkmate! I'm the gweatest!",
                "I win! Time to go swimming!",
                "Gween Fwog is the champion of the univewse!"
            ]
        };

        function getFrogTalk(eval) {
            let cat = 'neutral';
            if (eval > 1.5) cat = 'winning';
            else if (eval < -1.5) cat = 'losing';
            const list = frogQuotes[cat];
            return list[Math.floor(Math.random() * list.length)];
        }

        function triggerCheat() {
            const history = game.history({ verbose: true });
            const lastMove = history[history.length - 1];
            speak("You Checkmate Me? I THINK NOT!");
            setTimeout(() => {
                game.remove(lastMove.to); game.load(game.fen()); board.position(game.fen());
                speak("There. Much better. My turn! Wibbit!");
                $('#officialResult').show();
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go movetime 100');
            }, 600);
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    if (game.in_checkmate()) { triggerCheat(); return; }
                    speak(frogQuotes.thinking[Math.floor(Math.random() * frogQuotes.thinking.length)]);
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go movetime 100');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                let score = parseInt(e.data.split('cp ')[1].split(' ')[0]);
                currentEval = (game.turn() === 'b' ? score : -score) / 100;
            }
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                if (game.in_checkmate()) { 
                    speak(frogQuotes.victory[Math.floor(Math.random() * frogQuotes.victory.length)]); 
                    $('#board').addClass('victory-shake'); 
                }
                else {
                    speak(getFrogTalk(currentEval));
                }
            }
        };

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); board.position(game.fen());
            speak("Wibbit! A do-over? I saw that!");
        });

        $(document).ready(function() {
            board = Chessboard('board', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
