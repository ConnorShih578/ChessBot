<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Gween Fwog</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; display: flex; flex-direction: column; align-items: center; background: #e8f5e9; color: #2e7d32; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; border: 6px solid #4caf50; border-radius: 12px; }
        #trashTalk { background: #2e7d32; color: white; padding: 15px; border-radius: 20px; border: 4px solid #81c784; margin-bottom: 15px; width: 380px; text-align: center; min-height: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .highlight-sq { box-shadow: inset 0 0 3px 3px #a5d6a7; }
        .highlight-last { background-color: rgba(129, 199, 132, 0.6) !important; }
        .nav-links { margin-bottom: 15px; }
        .nav-link { text-decoration: none; color: #1b5e20; font-weight: bold; }
        .cheat-text { color: #d32f2f; font-weight: bold; display: none; margin-top: 15px; background: white; padding: 5px 15px; border-radius: 10px; border: 2px solid #d32f2f; }
        button { margin: 10px; padding: 10px 25px; background: #4caf50; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-link">Challenge Martina →</a>
    </div>

    <div id="trashTalk">"Ribbit! Let's have a sensible game."</div>
    <div id="board"></div>
    <div id="officialResult" class="cheat-text">OFFICIAL RESULT: YOU WON! (Fwog Cheated)</div>

    <div>
        <button id="undoBtn">Undo Move</button>
        <button onclick="location.reload()">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, currentEval = 0.0;

        engine.postMessage('uci');
        engine.postMessage('setoption name Skill Level value 0'); 
        engine.postMessage('setoption name Threads value 1');

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    if (game.in_checkmate()) {
                    // Small delay so you can actually see the checkmate happen first
                    setTimeout(triggerCheat, 1000); 
                    return; 
                    }
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 8');
                    $('#trashTalk').text('"Ribbit... thinking..."');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) currentEval = parseInt(e.data.split('cp ')[1].split(' ')[0]) / 100;
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+m.substring(0, 2)+', .square-'+m.substring(2, 4)).addClass('highlight-last');
                $('#trashTalk').text(currentEval > 2.0 ? '"RIBBIT! I\'M HOPPING TO VICTORY!"' : '"A very sensible position. Ribbit."');
            }
        };

       function triggerCheat() {
            // Get the piece you just used to checkmate him
            const history = game.history({ verbose: true });
            const lastMove = history[history.length - 1];

            $('#trashTalk').text('"I THINK NOT! THAT PIECE IS UNSENSIBLE!"');
            
            setTimeout(() => {
                // DELETE the piece from the internal game logic
                game.remove(lastMove.to); 
                
                // RE-LOAD the game state to "unlock" the checkmate status
                // This is the magic step that lets the game continue!
                game.load(game.fen()); 

                // Update the visual board so the piece vanishes
                board.position(game.fen());
                
                // Force the frog to take a turn immediately
                $('#trashTalk').text('"There. Much better. My turn! Ribbit!"');
                $('#officialResult').show(); // Show the cheat message
                
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 8');
                
                sourceSquare = null; 
            }, 1000);
        }

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); board.position(game.fen());
            $('.square-55d63').removeClass('highlight-last');
            $('#trashTalk').text('"Ribbit! A do-over?"');
        });

        $(document).ready(function() {
            board = Chessboard('board', {
                position: 'start', draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
