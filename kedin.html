<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Gween Fwog</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #e8f5e9; --side: #c8e6c9; --dark: #2e7d32; --light: #4caf50; }
        body { background: var(--bg); color: var(--dark); font-family: 'Comic Sans MS', cursive; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #game-container { display: flex; gap: 20px; width: 100%; max-width: 1000px; height: 600px; margin-top: 15px; }
        #board { width: 550px; border: 8px solid var(--light); border-radius: 20px; }
        #sidebar { flex: 1; background: var(--side); border-radius: 30px; padding: 20px; display: flex; flex-direction: column; border: 4px solid var(--dark); }
        #chat-window { flex: 1; background: white; border-radius: 20px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 2px dashed var(--dark); display: flex; flex-direction: column; gap: 10px; }
        .bubble { background: #f1f8e9; padding: 12px; border-radius: 18px; align-self: flex-start; border: 1px solid var(--light); font-weight: bold; }
        button { padding: 12px; background: var(--light); color: white; border: none; border-radius: 25px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="board"></div>
        <div id="sidebar">
            <div style="font-size:2.5em; text-align:center;">🐸</div>
            <div id="chat-window"></div>
            <button onclick="location.reload()">Pway Again!</button>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), currentEval = 0.0;
        engine.postMessage('uci');

        const frogQuotes = {
            winning: ["You're going to woose.", "Ha ha ha, you're woosing!", "Wibbit. Just Wesign", "I'm the gweatest fwog ever!", "My pond, my wules, my victory!", "Wibbit! You're in twouble now!"],
            losing: ["Wibbit. No fair!", "Wibiiiit! Stop that!", "Would you wike to wet me win?", "My hopping skills are failing me...", "Wait! That wasn't supposed to happen!"],
            neutral: ["Wibbit.", "Wibbit. Who's winning?", "Do you have any fwies?", "I like the gween pieces best.", "Wibbit wibbit wibbit!"],
            thinking: ["Wibbit... thinking...", "Searching for fwies...", "Counting my hops...", "Wibbit... wait a second..."],
            victory: ["WIBBIT! THE POND IS MINE!", "Checkmate! I'm the gweatest!", "Victory hop! Wibbit wibbit!"]
        };

        function speak(text) {
            $('#chat-window').append(`<div class="bubble">${text}</div>`);
            $('#chat-window').scrollTop($('#chat-window')[0].scrollHeight);
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            
            var move = game.move({ from: $('.highlight-sq').attr('data-square'), to: square, promotion: 'q' });
            
            if (!move) {
                $('.square-55d63').removeClass('highlight-sq');
                if (game.get(square) && game.get(square).color === 'w') $(this).addClass('highlight-sq');
            } else {
                $('.square-55d63').removeClass('highlight-sq');
                board.position(game.fen());

                // Gween Fwog's "New Queen" Cheat
                if (game.in_checkmate()) { 
                    speak("I lose?? Awww... Well, I THINK NOT!!"); 
                    
                    // 1. Get the square where your piece just landed
                    let landingSquare = move.to;

                    // 2. Undo the move to reset the board state
                    game.undo(); 
                    
                    // 3. Remove your piece from its original position (if it's still there) 
                    // and place a Black Queen on the square you tried to move to
                    game.remove(move.from); 
                    game.put({ type: 'q', color: 'b' }, landingSquare);
                    
                    board.position(game.fen());
                    speak("Wibbit! I promoted your piece! Now, I have a queen on " + landingSquare + "!");
                    return; 
                }

                speak(frogQuotes.thinking[Math.floor(Math.random() * frogQuotes.thinking.length)]);
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go movetime 500');
            }
        }

        engine.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                speak(game.in_checkmate() ? frogQuotes.victory[0] : frogQuotes.neutral[Math.floor(Math.random() * frogQuotes.neutral.length)]);
            }
        };

        $(document).ready(function() {
            board = Chessboard('board', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $(document).on('click', '.square-55d63', onSquareClick);
            speak("Wibbit! Let's pway!");
        });
    </script>
</body>
</html>
