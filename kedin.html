<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Gween Fwog</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; display: flex; flex-direction: column; align-items: center; background: #e8f5e9; color: #2e7d32; padding-top: 20px; }
        #board { width: 400px; border: 4px solid #4caf50; border-radius: 8px; }
        #trashTalk { background: #2e7d32; color: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; width: 380px; text-align: center; border: 3px solid #81c784; min-height: 40px; }
        .highlight-last { background-color: rgba(129, 199, 132, 0.6) !important; }
        .cheat-text { color: #d32f2f; font-weight: bold; display: none; margin-top: 10px; }
        button { padding: 10px 20px; background: #4caf50; color: white; border: none; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="trashTalk">"Ribbit! Let's have a sensible game."</div>
    <div id="board"></div>
    <div id="officialResult" class="cheat-text">OFFICIAL RESULT: YOU WON! (Fwog Cheated)</div>
    <div style="margin-top:20px;">
        <button onclick="location.reload()">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), sourceSquare = null, currentEval = 0.0;
        var engine = new Worker('./stockfish-18-lite-single.js');

        engine.postMessage('uci');
        engine.postMessage('setoption name Skill Level value 0');

        function onSquareClick(square) {
            if (game.game_over()) return;
            if (sourceSquare === null) {
                if (game.get(square) && game.get(square).color === 'w') {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    if (game.in_checkmate()) { triggerCheat(); return; }
                    $('#trashTalk').text('"Focusing on the pond... my turn."');
                    engine.postMessage('position fen ' + game.fen());
                    engine.postMessage('go depth 8');
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) {
                currentEval = parseInt(e.data.split('cp ')[1].split(' ')[0]) / 100;
            }
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+m.substring(0, 2)+', .square-'+m.substring(2, 4)).addClass('highlight-last');
                
                if (currentEval > 3.0) {
                    $('#trashTalk').text('"RIBBIT! I\'M HOPPING TO VICTORY! TAKE THAT RED TOAD!"');
                } else if (currentEval < -3.0) {
                    $('#trashTalk').text('"Whatever... Red Toad probably sabotaged my lilypad."');
                } else {
                    $('#trashTalk').text('"A very sensible position. Ribbit."');
                }
            }
        };

        function triggerCheat() {
            $('#trashTalk').text('"I THINK NOT!"');
            setTimeout(() => {
                let kp = "";
                game.board().forEach(r => r.forEach(s => { if(s && s.type==='k' && s.color==='w') kp = s.square; }));
                board.move('h8-' + kp); 
                $('#officialResult').show();
            }, 1000);
        }

        board = Chessboard('board', { position: 'start', draggable: false });
        $('#board').on('click', '.square-55d63', function() { onSquareClick($(this).attr('data-square')); });
    </script>
</body>
</html>
