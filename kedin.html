<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Gween Fwog</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Comic Sans MS', 'Chalkboard SE','Comic Neue' ,Cursive, sans-serif; display: flex; flex-direction: column; align-items: center; background: #e8f5e9; color: #2e7d32; padding-top: 20px; }
        #board { width: 400px; max-width: 95vw; border: 6px solid #4caf50; border-radius: 12px; }
        #trashTalk { background: #2e7d32; color: white; padding: 15px; border-radius: 20px; border: 4px solid #81c784; margin-bottom: 15px; width: 380px; text-align: center; min-height: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-weight: bold; transition: background 0.3s; }
        .highlight-sq { box-shadow: inset 0 0 3px 3px #a5d6a7; }
        .highlight-last { background-color: rgba(129, 199, 132, 0.6) !important; }
        .nav-links { margin-bottom: 15px; }
        .nav-link { text-decoration: none; color: #1b5e20; font-weight: bold; }
        .cheat-text { color: #d32f2f; font-weight: bold; display: none; margin-top: 15px; background: white; padding: 5px 15px; border-radius: 10px; border: 2px solid #d32f2f; }
        button { margin: 10px; padding: 10px 25px; background: #4caf50; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
        
        /* Shake animation for Fwog victory */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .victory-shake { animation: shake 0.5s; animation-iteration-count: 2; }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-link">Challenge Martina →</a>
    </div>

    <div id="trashTalk">"Wibbit! Let's have a sensible game."</div>
    <div id="board"></div>
    <div id="officialResult" class="cheat-text">OFFICIAL RESULT: YOU WON! (Fwog Cheated)</div>

    <div>
        <button id="undoBtn">Undo Move</button>
        <button onclick="location.reload()">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess(), engine = new Worker('./stockfish-18-lite-single.js'), sourceSquare = null, currentEval = 0.0;

        // --- GWEEN FWOG BRAIN CONFIG ---
        engine.postMessage('uci');
        engine.postMessage('setoption name Skill Level value 0'); 
        engine.postMessage('setoption name UCI_LimitStrength value true');
        engine.postMessage('setoption name UCI_Elo value 800'); 

        // --- DYNAMIC COMMENTARY DATA ---
        const frogQuotes = {
            winning: [
                "You're going to woose.",
                "Ha ha ha, you're woosing!",
                "Wibbit. Just Wesign"
            ],
            losing: [
                "Wibbit. At weast you're doing better than Red Toad",
                "Wibiiiit!",
                "Would you wike the once in a wifetime oppuwtunity to wet me win?",
                "Ooooh, wook! A fwy!"
            ],
            neutral: [
                "Wibbit.",
                "Wibbit. Who's winning?",
                "I see a fwy!"
            ],
            thinking: [
                "Wibbit... thinking...",
                "Searching for fwies...",
                "Contempwating the wiwypad..."
            ],
            victory: [
                "WIBBIT! THE POND IS MINE!",
                "Checkmate! I'm the gweatest!",
                "Victory hop! Wibbit wibbit!",
                "You fought well, for a non-amphibian.",
                "At least you're better than Red Toad."
            ]
        };

        function getFrogTalk(evaluation) {
            let category = 'neutral';
            if (evaluation > 1.5) category = 'winning';
            if (evaluation < -1.5) category = 'losing';
            const list = frogQuotes[category];
            return list[Math.floor(Math.random() * list.length)];
        }

        function triggerVictory() {
            const winMsg = frogQuotes.victory[Math.floor(Math.random() * frogQuotes.victory.length)];
            $('#trashTalk').css('background', '#1b5e20'); 
            $('#trashTalk').text('"' + winMsg + '"');
            $('#board').addClass('victory-shake');
            setTimeout(() => $('#board').removeClass('victory-shake'), 1000);
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            if (game.game_over()) return;
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-sq');
                if (move) {
                    board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-last');
                    $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                    
                    if (game.in_checkmate()) {
                        setTimeout(triggerCheat, 1000); 
                        return; 
                    }

                    $('#trashTalk').text('"' + frogQuotes.thinking[Math.floor(Math.random() * frogQuotes.thinking.length)] + '"');
                    engine.postMessage('position fen ' + game.fen());
                    
                    setTimeout(() => {
                        engine.postMessage('go movetime 1000');
                    }, 500);
                }
                sourceSquare = null;
            }
        }

        engine.onmessage = function(e) {
            if (e.data.includes('score cp')) currentEval = parseInt(e.data.split('cp ')[1].split(' ')[0]) / 100;
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                var move = game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                $('.square-55d63').removeClass('highlight-last');
                $('.square-'+move.from+', .square-'+move.to).addClass('highlight-last');
                
                if (game.in_checkmate()) {
                    triggerVictory();
                } else {
                    $('#trashTalk').text('"' + getFrogTalk(currentEval) + '"');
                }
            }
        };

        function triggerCheat() {
            const history = game.history({ verbose: true });
            const lastMove = history[history.length - 1];

            $('#trashTalk').text('"You Checkmate Me? I THINK NOT!"');
            
            setTimeout(() => {
                game.remove(lastMove.to); 
                game.load(game.fen()); 
                board.position(game.fen());
                
                $('#trashTalk').text('"There. Much better. My turn! Wibbit!"');
                $('#officialResult').show(); 
                
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go movetime 1000');
                
                sourceSquare = null; 
            }, 1200);
        }

        $('#undoBtn').on('click', function() {
            game.undo(); game.undo(); board.position(game.fen());
            $('.square-55d63').removeClass('highlight-last');
            $('#trashTalk').css('background', '#2e7d32');
            $('#trashTalk').text('"Wibbit! A do-over?"');
        });

        $(document).ready(function() {
            board = Chessboard('board', {
                position: 'start', draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(document).on('click', '.square-55d63', onSquareClick);
        });
    </script>
</body>
</html>
